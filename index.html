<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agentic Git — Command Reference</title>
<meta name="description" content="Every git command, one sidebar, one animation each. Implementation-ready reference for developers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ DESIGN TOKENS (from DESIGN.md) ============ */
:root{
  --font-primary: 'Inter var', Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  --font-size-base: 19.25px;
  --font-weight-base: 400;
  --line-height-base: 32.725px;

  --font-size-xs: 11px;   /* used as 11px floor, DESIGN.md's xs=0 is a bug guard */
  --font-size-sm: 11px;
  --font-size-md: 12px;
  --font-size-lg: 13px;
  --font-size-xl: 14px;
  --font-size-2xl: 14.08px;
  --font-size-3xl: 14.3px;
  --font-size-4xl: 15.4px;

  --color-text-primary: #fafafa;
  --color-text-secondary: #d4d4d8;
  --color-text-tertiary: #a1a1aa;
  --color-text-inverse: #111827;
  --color-surface-base: #000000;
  --color-surface-muted: #ffffff;
  --color-surface-raised: #07070d;

  --space-1: 1px;
  --space-2: 4.4px;
  --space-3: 6px;
  --space-4: 6.6px;
  --space-5: 8px;
  --space-6: 8.8px;
  --space-7: 10px;
  --space-8: 11px;
  /* extended scale for macro layout, multiples of the base rhythm */
  --space-10: 16px;
  --space-12: 22px;
  --space-16: 32px;
  --space-20: 44px;

  --radius-xs: 2.2px;
  --radius-sm: 8px;
  --radius-md: 10px;
  --radius-lg: 12px;
  --radius-xl: 14px;
  --radius-2xl: 18px;
  --radius-pill: 999px;

  --shadow-1: rgba(0,0,0,0.25) 0px 4.4px 11px 0px, rgba(0,0,0,0.25) 0px 0px 1.1px 0px;
  --shadow-2: rgba(15,23,42,0.08) 0px 1px 2px 0px;
  --shadow-3: rgba(15,23,42,0.2) 0px 20px 60px 0px;
  --shadow-4: rgba(15,23,42,0.04) 0px 10px 30px 0px;

  --motion-instant: 120ms;
  --motion-fast: 150ms;
  --motion-normal: 160ms;
  --motion-slow: 180ms;
  --motion-slower: 200ms;
  --motion-step6: 250ms;

  --accent: #7c9eff;
  --accent-2: #5eead4;
  --accent-warn: #fbbf24;
  --accent-danger: #f87171;
  --border: rgba(255,255,255,0.09);
  --border-strong: rgba(255,255,255,0.18);
}

*{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }
body{
  margin:0;
  background:var(--color-surface-base);
  color:var(--color-text-primary);
  font-family:var(--font-primary);
  font-size:16px;
  font-weight:var(--font-weight-base);
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{ font-family:var(--font-primary); font-weight:700; margin:0; color:var(--color-text-primary); letter-spacing:-0.01em; }
p{ margin:0 0 0.8em; color:var(--color-text-secondary); }
code,.mono{ font-family:var(--font-mono); }
a{ color:var(--accent); }
::selection{ background:var(--accent); color:#000; }

/* focus-visible: required, never suppressed */
:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
  border-radius:var(--radius-xs);
}
:focus:not(:focus-visible){ outline:none; }

.skip-link{
  position:absolute; left:-999px; top:0; z-index:999;
  background:var(--accent); color:#000; padding:var(--space-7) var(--space-10);
  border-radius:var(--radius-sm); font-weight:600; text-decoration:none;
}
.skip-link:focus{ left:var(--space-10); top:var(--space-10); }

/* ============ APP SHELL ============ */
.app{
  display:grid;
  grid-template-columns: 300px 1fr;
  min-height:100vh;
}
@media (max-width: 900px){
  .app{ grid-template-columns:1fr; }
  .sidebar{ position:relative; height:auto; max-height:52vh; }
}

/* ---------------- Sidebar ---------------- */
.sidebar{
  background:var(--color-surface-raised);
  border-right:1px solid var(--border);
  position:sticky; top:0; height:100vh; overflow-y:auto;
  padding:var(--space-10) var(--space-8) var(--space-16);
  scrollbar-width:thin;
}
.sidebar::-webkit-scrollbar{ width:7px; }
.sidebar::-webkit-scrollbar-thumb{ background:var(--border-strong); border-radius:var(--radius-pill); }

.brand{
  display:flex; align-items:center; gap:var(--space-6);
  padding:0 var(--space-3) var(--space-10);
  margin-bottom:var(--space-8);
  border-bottom:1px solid var(--border);
}
.brand-mark{
  width:32px; height:32px; border-radius:var(--radius-sm);
  background:linear-gradient(135deg, var(--accent), var(--accent-2));
  display:flex; align-items:center; justify-content:center; font-weight:800; color:#000; font-size:15px;
  flex:0 0 auto;
}
.brand-text{ font-weight:700; font-size:15px; line-height:1.2; }
.brand-text small{ display:block; font-weight:400; font-size:11px; color:var(--color-text-tertiary); margin-top:2px; }

.search-wrap{ padding:0 var(--space-3); margin-bottom:var(--space-10); }
.search-input{
  width:100%; background:rgba(255,255,255,0.04); border:1px solid var(--border);
  color:var(--color-text-primary); font-family:var(--font-primary); font-size:13px;
  padding:var(--space-6) var(--space-7); border-radius:var(--radius-md);
  transition:border-color var(--motion-fast) ease, background var(--motion-fast) ease;
}
.search-input::placeholder{ color:var(--color-text-tertiary); }
.search-input:hover{ background:rgba(255,255,255,0.06); }
.search-input:focus-visible{ border-color:var(--accent); background:rgba(255,255,255,0.06); }

.stats-row{
  display:flex; gap:var(--space-6); padding:0 var(--space-3); margin-bottom:var(--space-10);
  font-size:11px; color:var(--color-text-tertiary);
}
.stats-row b{ color:var(--color-text-secondary); }

.nav-groups{ list-style:none; margin:0; padding:0; }
.nav-group{ margin-bottom:var(--space-3); }
.nav-group summary{
  list-style:none; cursor:pointer; display:flex; align-items:center; gap:var(--space-5);
  padding:var(--space-6) var(--space-3); border-radius:var(--radius-md);
  font-size:13px; font-weight:600; color:var(--color-text-secondary);
  transition:background var(--motion-fast) ease, color var(--motion-fast) ease;
}
.nav-group summary::-webkit-details-marker{ display:none; }
.nav-group summary:hover{ background:rgba(255,255,255,0.045); color:var(--color-text-primary); }
.nav-group summary .chev{ margin-left:auto; font-size:10px; color:var(--color-text-tertiary); transition:transform var(--motion-fast) ease; }
.nav-group[open] summary .chev{ transform:rotate(90deg); }
.nav-group .gicon{ font-size:15px; width:20px; text-align:center; flex:0 0 auto; }
.nav-group .gcount{ font-size:10px; color:var(--color-text-tertiary); background:rgba(255,255,255,0.05); padding:1px 6px; border-radius:var(--radius-pill); }

.nav-items{ list-style:none; margin:2px 0 var(--space-5); padding:0 0 0 calc(20px + var(--space-5)); display:flex; flex-direction:column; gap:1px; }
.nav-item{
  display:block; width:100%; text-align:left; background:none; border:none; cursor:pointer;
  color:var(--color-text-tertiary); font-family:var(--font-mono); font-size:12px;
  padding:var(--space-5) var(--space-6); border-radius:var(--radius-sm);
  transition:background var(--motion-instant) ease, color var(--motion-instant) ease;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.nav-item:hover{ background:rgba(255,255,255,0.05); color:var(--color-text-secondary); }
.nav-item[aria-current="true"]{ background:var(--accent); color:#000; font-weight:600; }

/* ---------------- Main content ---------------- */
.main{ padding:var(--space-20) clamp(var(--space-10), 5vw, 64px); max-width:900px; }

.topbar{
  display:none;
}
@media (max-width:900px){
  .topbar{ display:block; padding:var(--space-8); border-bottom:1px solid var(--border); }
}

.crumb{
  font-family:var(--font-mono); font-size:11px; letter-spacing:0.08em; text-transform:uppercase;
  color:var(--color-text-tertiary); margin-bottom:var(--space-6);
  display:flex; align-items:center; gap:var(--space-4);
}
.crumb .sep{ opacity:0.5; }
.crumb .cur{ color:var(--accent-2); }

.cmd-title{
  font-family:var(--font-mono); font-size:clamp(22px,4vw,34px); font-weight:700;
  color:var(--color-text-primary); margin-bottom:var(--space-10); line-height:1.3;
  word-break:break-word;
  background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:var(--radius-lg);
  padding:var(--space-10) var(--space-12); box-shadow:var(--shadow-2);
}

.cat-context{
  border:1px solid var(--border); border-radius:var(--radius-lg); padding:var(--space-10) var(--space-12);
  margin-bottom:var(--space-10); background:rgba(255,255,255,0.02);
}
.cat-context .eyebrow{ font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--accent-2); font-weight:700; margin-bottom:var(--space-5); }
.cat-context p{ font-size:14px; margin-bottom:var(--space-5); }
.cat-context .analogy-line{ font-size:13px; color:var(--color-text-tertiary); font-style:italic; }

.scenario-card{
  border:1px solid var(--border); border-radius:var(--radius-xl); padding:var(--space-12);
  margin-bottom:var(--space-10); background:linear-gradient(160deg, rgba(124,158,255,0.06), transparent);
  box-shadow:var(--shadow-4);
}
.scenario-card .label{ font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--accent); font-weight:700; margin-bottom:var(--space-5); }
.scenario-card p{ font-size:15px; color:var(--color-text-primary); margin:0; }

.stage-grid{ display:grid; grid-template-columns:1fr 1fr; gap:var(--space-10); margin-bottom:var(--space-10); }
@media (max-width:720px){ .stage-grid{ grid-template-columns:1fr; } }

.panel{
  border:1px solid var(--border); border-radius:var(--radius-xl); background:var(--color-surface-raised);
  box-shadow:var(--shadow-1); overflow:hidden;
}
.panel-head{
  padding:var(--space-6) var(--space-10); border-bottom:1px solid var(--border);
  font-family:var(--font-mono); font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-text-tertiary);
  display:flex; justify-content:space-between; align-items:center;
}
.icon-stage{ min-height:220px; display:flex; align-items:center; justify-content:center; padding:var(--space-10); cursor:crosshair; }
.icon-stage:hover svg *{ animation-play-state:paused !important; }
.terminal-body{
  min-height:220px; padding:var(--space-10); font-family:var(--font-mono); font-size:13px;
}
.terminal-body .prompt{ color:var(--color-text-tertiary); }
.terminal-body .typed{ color:var(--accent-2); }
.terminal-body .tcursor{ display:inline-block; width:0.5em; height:1em; background:var(--accent-2); vertical-align:-0.15em; animation:blink 0.9s steps(1) infinite; }
.terminal-body .out{ color:var(--color-text-tertiary); margin-top:var(--space-6); white-space:pre-wrap; line-height:1.5; }
@keyframes blink{ 50%{ opacity:0; } }

.btn-row{ display:flex; gap:var(--space-5); flex-wrap:wrap; margin-bottom:var(--space-10); }
.btn{
  font-family:var(--font-mono); font-size:12px; font-weight:600;
  background:rgba(255,255,255,0.04); border:1px solid var(--border); color:var(--color-text-primary);
  padding:var(--space-6) var(--space-10); border-radius:var(--radius-pill); cursor:pointer;
  transition:all var(--motion-fast) ease;
}
.btn:hover{ border-color:var(--accent); background:rgba(124,158,255,0.12); transform:translateY(-1px); }
.btn:active{ transform:translateY(0); }
.btn:disabled{ opacity:0.4; cursor:not-allowed; transform:none; }
.btn.primary{ background:var(--accent); color:#000; border-color:var(--accent); }
.btn.primary:hover{ box-shadow:0 6px 18px -6px rgba(124,158,255,0.6); }

/* related commands list */
.related-title{ font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-text-tertiary); margin-bottom:var(--space-6); font-weight:700; }
.related-list{ list-style:none; margin:0 0 var(--space-16); padding:0; display:grid; grid-template-columns:1fr 1fr; gap:var(--space-5); }
@media (max-width:600px){ .related-list{ grid-template-columns:1fr; } }
.related-item{
  border:1px solid var(--border); border-radius:var(--radius-md); padding:var(--space-6) var(--space-8);
  cursor:pointer; background:rgba(255,255,255,0.015); transition:all var(--motion-fast) ease;
}
.related-item:hover{ border-color:var(--accent); background:rgba(124,158,255,0.06); transform:translateX(2px); }
.related-item code{ display:block; color:var(--accent-2); font-size:12px; margin-bottom:2px; }
.related-item span{ font-size:11px; color:var(--color-text-tertiary); display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

.empty-state{
  text-align:center; padding:var(--space-20) var(--space-10); color:var(--color-text-tertiary);
}
.empty-state h2{ color:var(--color-text-secondary); margin-bottom:var(--space-6); }

/* svg icon coloring */
.icon-stage svg text{ font-family:var(--font-mono); }

/* ---------------- Motion keyframes (reused per-category) ---------------- */
@keyframes popIn{ 0%{transform:scale(0.3) rotate(-6deg); opacity:0;} 60%{transform:scale(1.15) rotate(2deg);} 100%{transform:scale(1) rotate(0); opacity:1;} }
@keyframes pulseGlow{ 0%,100%{filter:drop-shadow(0 0 2px currentColor);} 50%{filter:drop-shadow(0 0 14px currentColor);} }
@keyframes dashFlow{ to{ stroke-dashoffset:-40; } }
@keyframes gearSpin{ to{ transform:rotate(360deg); } }
@keyframes flyAcross{ 0%{transform:translateX(-70px); opacity:0;} 20%{opacity:1;} 80%{opacity:1;} 100%{transform:translateX(70px); opacity:0;} }
@keyframes sweepOff{ 0%{transform:translateX(0); opacity:1;} 100%{transform:translateX(80px); opacity:0;} }
@keyframes slideIn{ 0%{transform:translateX(-46px); opacity:0;} 100%{transform:translateX(0); opacity:1;} }
@keyframes hunkFade{ 0%{opacity:0;} 100%{opacity:1;} }
@keyframes cloudPulse{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.12);} }
@keyframes hexFlicker{ 0%,100%{opacity:1;} 50%{opacity:0.3;} }
@keyframes reorderHop{ 0%{transform:translateY(0);} 50%{transform:translateY(-18px);} 100%{transform:translateY(0);} }
@keyframes ringBurst{ 0%{r:4; stroke-width:6; stroke-opacity:0.9;} 100%{r:36; stroke-width:0.5; stroke-opacity:0;} }
@keyframes shakeX{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-4px);} 75%{transform:translateX(4px);} }
</style>
</head>

<div class="app">
  <nav class="sidebar" id="sidebar" aria-label="Git command categories">
    <div class="brand">
      <div class="brand-mark">⌥</div>
      <div class="brand-text">Agentic Git<small>143 commands · 20 categories</small></div>
    </div>
    <div class="search-wrap">
      <input class="search-input" id="searchInput" type="search" placeholder="Search commands…" aria-label="Search commands">
    </div>
    <div class="stats-row" id="statsRow"></div>
    <ul class="nav-groups" id="navGroups"></ul>
  </nav>

  <main class="main" id="main">
    <div id="content"></div>
  </main>
</div>

<script>
const CATEGORIES = [{"icon":"🚪","name":"Meet the Machine","num":"00","desc":"Before typing a single command, understand git's <b>3-room house</b>: your <b>Working Directory</b> (the desk you're editing on), the <b>Staging Area</b> (a tray where you place things you're about to photograph), and the <b>Repository</b> (the photo album where snapshots live forever).","analogy":"Think of git like a camera with a prep tray. You don't photograph your whole messy desk — you pick items, put them on a tray (stage), then press the shutter (commit) to save a permanent photo.","items":[["git config --global user.name \"...\"","Stamps your name on every photo you take, so the album knows whose work it is."],["git config --global user.email \"...\"","Same idea — your email becomes part of every commit signature."],["git config --list","Scenario: you forgot which name/email you set on this machine — check before your first commit."],["git --version","Scenario: setting up a new machine — confirms git actually installed and which version."],["git config --global init.defaultBranch main","Scenario: tired of new repos defaulting to \"master\" — sets your preferred default branch name once, globally."]]},{"icon":"🍳","name":"Save Points","num":"01","desc":"This is the core loop you'll repeat thousands of times: <b>edit → stage → commit</b>. Every commit is a save point you can always return to.","analogy":"Like a video game's save system. You play (edit files), walk to a checkpoint and load your inventory into it (stage), then hit 'Save Game' (commit). Each save is permanent and named.","items":[["git init","Scenario: starting a brand new project folder — turns an ordinary folder into a git-tracked one."],["git status","Scenario: you forget what you changed — shows what's edited, staged, or untouched right now."],["git add <file>","Scenario: you fixed one bug in a 5-file change — stage only that file, leave the rest for later."],["git commit -m \"msg\"","Scenario: staged changes are ready — permanently saves them with a message explaining why."],["git log --oneline","Scenario: reviewing project history fast — one line per save point."],["git diff / --staged","Scenario: \"what exactly did I change?\" — diff shows unstaged edits, --staged shows what's about to be committed."],[".gitignore","Scenario: build folders / secrets keep showing up in git status — lists patterns git should never track."],["git show <commit>","Scenario: want the exact snapshot + diff of one specific save point — shows it in full."]]},{"icon":"🕰️","name":"The Time Machine","num":"02","desc":"Mistakes happen. Git gives you three very different undo buttons — each rewrites a different amount of history.","analogy":"Amend = 'retake the last photo before anyone saw it.' Reset = 'rip pages out of the album.' Revert = 'add a new photo that visibly cancels the old one, keeping the record honest.'","items":[["git commit --amend","Scenario: typo in your last commit message, or forgot one file — fixes the most recent save point in place."],["git reset --soft HEAD~1","Scenario: last commit was too early — uncommits it but keeps changes staged."],["git reset --hard HEAD~1","Scenario: last commit was garbage, nuke it entirely — DANGER: deletes the work too."],["git revert <commit>","Scenario: bad commit already pushed and others pulled it — adds a new commit that undoes it, history stays intact."],["git restore <file>","Scenario: you messed up a file, want your last saved version back."],["git restore --staged <file>","Scenario: you staged the wrong file by mistake — takes it off the tray, keeps your edits."],["git reset --mixed HEAD~1","Scenario: default reset mode — uncommits AND unstages, but keeps your edits on disk."]]},{"icon":"🪞","name":"Parallel Timelines","num":"03","desc":"A branch is a separate timeline you can experiment in without touching the main story. Merging is how two timelines rejoin into one.","analogy":"Like a choose-your-own-adventure book: you photocopy the current page (branch), scribble a wild idea on the copy, and if it works out you glue it back into the main book (merge). If two pages changed the same sentence — that's a conflict, and you decide the final wording by hand.","items":[["git branch <name>","Scenario: about to try a risky idea — create a parallel timeline without touching main."],["git switch -c <name>","Scenario: same as above but jump into it immediately — create + switch in one move."],["git merge <branch>","Scenario: your feature branch works — fold its timeline back into main."],["(conflict) edit → git add → git commit","Scenario: two branches touched the same line — git can't auto-decide, you pick the final version by hand."],["git branch -d <name>","Scenario: feature merged and done — delete the now-redundant branch."],["git branch -D <name>","Scenario: branch has UNMERGED work you're sure you don't need — force-deletes it anyway."],["git switch <branch> / checkout <branch>","Scenario: hopping between existing timelines — moves your working directory to that branch's snapshot."],["git merge <branch> (fast-forward)","Scenario: main hasn't moved since you branched — git just slides the main pointer forward, no merge commit needed."]]},{"icon":"☁️","name":"Talking to the Cloud","num":"04","desc":"Your repository can have a twin living on a server (GitHub etc). Push sends your photos up; pull brings new photos down.","analogy":"Think of it like a shared Dropbox album. 'Push' uploads your new photos for everyone. 'Fetch' peeks at what others added without touching your album. 'Pull' actually merges those new photos into yours.","items":[["git remote add origin <url>","Scenario: local project exists, no cloud copy yet — links it to a GitHub repo address."],["git push -u origin main","Scenario: first upload — sends commits up and remembers this pairing for future pushes."],["git fetch","Scenario: \"did my teammate push anything?\" — downloads new history WITHOUT merging it into your files yet."],["git pull","Scenario: you want teammates' changes merged into your working copy right now — fetch + merge combined."],["git clone <url>","Scenario: joining a project for the first time — downloads the entire repo + history to a new machine."],["git remote -v","Scenario: \"which cloud is this actually linked to?\" — lists remote names and their URLs."],["tracking branches","Scenario: after first push -u, plain \"git push\"/\"git pull\" know where to sync — the local and remote branch are linked automatically."]]},{"icon":"✉️","name":"Pull Requests","num":"05","desc":"Teams rarely push straight to main. Instead: branch → push → open a Pull Request → get reviewed → merge.","analogy":"Like submitting a school essay draft for peer review before it goes in the final anthology. Your branch is the draft; the PR is the review thread; merging is publishing it into the anthology (main).","items":[["git push -u origin feature/x","Scenario: your branch is ready for eyes on it — pushes it to the cloud so a PR can be opened against it."],["Open Pull Request (GitHub UI)","Scenario: code's ready for review — proposes merging feature/x into main, teammates comment inline."],["git log --graph --oneline --all","Scenario: confused how branches relate — draws the whole tree of timelines in your terminal."],["Merge PR (squash / merge / rebase)","Scenario: review approved — folds the reviewed branch into main, closing the loop."],["Fork vs Clone","Scenario: contributing to a repo you don't own — fork makes your own cloud copy first, THEN you clone your fork locally."],["git rm --cached <file>","Scenario: a file got committed before you added it to .gitignore — untracks it from git without deleting it from disk."]]},{"icon":"🪜","name":"Rebase & Cherry-pick","num":"06","desc":"Rebase replays your commits on top of a new base — like editing the story so it reads as if it happened later, in order.","analogy":"Merge says 'these two timelines collided, here's a knot tying them together.' Rebase says 'pretend your changes happened AFTER everyone else's, so the story reads as one straight line.' Never rebase a timeline other people are already reading from (a shared/public branch) — you'd yank pages out from under them.","items":[["git rebase main","Scenario: main moved on while you worked — replay your branch's commits on top of the latest main for a clean, linear history."],["git rebase -i HEAD~4","Scenario: 4 messy \"wip\" commits before a PR — interactively squash/reword/reorder them into one clean commit."],["git cherry-pick <commit>","Scenario: one specific fix on another branch is needed here NOW, not the whole branch — grabs just that one commit."],["git reflog","Scenario: \"I think I just destroyed my work\" — a safety log of every place HEAD has ever pointed, your undo-undo button."],["git rebase --continue / --abort","Scenario: mid-rebase you hit a conflict — fix it and --continue, or bail entirely with --abort to return to how you started."]]},{"icon":"🔍","name":"Inspection & Debugging","num":"07","desc":"When something broke and you don't know when or who — git has a metal detector and a stash pocket.","analogy":"git bisect is playing 'hot or cold' with your commit history: git picks a midpoint, you say good/bad, it halves the search space each time until the guilty commit is caught. git stash is shoving your messy desk into a drawer so you can deal with something urgent, then pulling the drawer back out later.","items":[["git bisect start / good / bad","Scenario: a bug appeared sometime in the last 50 commits, unclear which — binary-searches to pinpoint the exact culprit."],["git blame <file>","Scenario: \"who wrote this weird line and why?\" — shows the commit + author responsible for each line."],["git stash","Scenario: mid-edit, urgent hotfix needed — shelves your unfinished changes so your working directory is clean."],["git stash pop","Scenario: hotfix done — brings your shelved changes back out."],["git log -S\"text\"","Scenario: \"which commit introduced/removed this exact string?\" — searches history by code content, not message."],["git log --author / --since / -p","Scenario: \"what did Priya change last week?\" — filters history by person, date range, or shows full patches inline."],["git stash list / apply / drop","Scenario: several shelved changes piled up — list sees them all, apply reuses one without removing it, drop discards one."],["git tag / annotated vs lightweight","Scenario: shipping v1.2.0 — tag marks that exact commit permanently; annotated tags also store author, date, and a message (use these for releases)."]]},{"icon":"🧱","name":"What Git Actually Is","num":"08","desc":"Under the hood, git is just a content-addressed graph of objects: blobs (file contents), trees (folders), commits (snapshots + parent links).","analogy":"Every version of every file gets a fingerprint (hash). A commit isn't a diff — it's a full snapshot that mostly points at the same unchanged fingerprints as before, only the changed ones are new. That's why git is fast: unchanged files cost almost nothing to 'save' again.","items":[["git cat-file -p <hash>","Scenario: curiosity / debugging deep issue — prints the raw content of any git object by its hash."],["git gc","Scenario: repo folder ballooning in size — compresses loose objects into efficient packfiles."],["git fsck","Scenario: suspect repo corruption — verifies the integrity of the whole object database."],[".git/ directory","Scenario: curious what git actually stores — objects/ (the album), refs/ (branch pointers), HEAD (your current position), all live here."],["detached HEAD","Scenario: you checked out a commit hash directly, not a branch — you're \"detached,\" new commits here can get lost unless you branch from them."]]},{"icon":"🚗","name":"Multi-repo & Large Projects","num":"09","desc":"Some projects are too big or too composed-of-other-projects for one flat repo.","analogy":"A submodule is a repo-inside-a-repo — like embedding a photo album inside another album, but it's really just a linked reference, not a copy. A worktree is having two doors into the same house, each door open to a different room (branch), simultaneously.","items":[["git submodule add <url>","Scenario: your project depends on another whole git repo (e.g. a shared component lib) — embeds it as a linked reference."],["git worktree add ../hotfix main","Scenario: mid-feature, urgent hotfix needed on main, don't want to stash — opens a second working folder on a different branch simultaneously."],["git sparse-checkout","Scenario: monorepo is huge, you only work in one folder — checks out just the slice you need."],["git subtree","Scenario: want another repo's code merged directly into yours (no separate linked repo to manage) — an alternative to submodules that copies the code in."],["Git LFS","Scenario: repo needs to track huge binary files (videos, PSDs) — stores pointers in git, actual bytes in a separate large-file store."]]},{"icon":"🛡️","name":"Workflow Mastery","num":"10","desc":"The final layer isn't new commands — it's discipline: conventions, automation, and safety nets that make git invisible in daily work.","analogy":"A pre-commit hook is a bouncer at the door of your repository, checking IDs before anything gets in. Conventional commits are a shared shorthand ('fix:', 'feat:') so history reads like a changelog, not a diary.","items":[["git commit -S -m \"...\"","Scenario: proving commits really came from you — cryptographically signs the commit."],["pre-commit hook","Scenario: block commits containing secrets or forbidden keywords, automatically, before they ever save."],["git config --global alias.co switch","Scenario: typing \"git switch\" 40x/day is tedious — aliases compress it to \"git co\"."],["git filter-repo","Scenario: a secret key got committed 200 commits ago — rewrites entire history to scrub it out (use with extreme care)."],["Git Flow / GitHub Flow / Trunk-Based","Scenario: choosing how your team branches — GitHub Flow (simple: branch + PR + merge), Git Flow (structured: develop/release/hotfix branches), Trunk-Based (everyone commits to main constantly, behind feature flags)."],["Conventional Commits (feat:, fix:, ...)","Scenario: want auto-generated changelogs — prefixing commit messages by type makes history machine-readable."]]},{"icon":"🗄️","name":"The Long Tail","num":"11","desc":"The rare commands: not daily-driver, but exactly what you reach for once a year and forget the syntax of every time.","analogy":"If phases 0-10 were the rooms of the house, this is the junk drawer — patch files instead of live syncing (like mailing a photocopy instead of sharing the album), bundles as a repo-in-a-single-file you can hand someone on a USB stick, and rerere as git remembering how you solved a fight last time so it doesn't ask twice.","items":[["git log --graph --pretty=format:\"...\"","Scenario: want a custom-formatted, colorized commit graph in scripts or aliases — full control over what each line shows."],["git diff --word-diff","Scenario: one word changed in a paragraph — highlights the exact word instead of the whole line."],["git rerere","Scenario: rebasing repeatedly hits the SAME conflict — git remembers your last resolution and reapplies it automatically."],["git notes","Scenario: want to attach a comment (\"reviewed by QA\") to a commit without rewriting it — notes live alongside, not inside, the commit."],["git archive","Scenario: need to hand someone the CODE only, no .git history — exports a clean zip/tar snapshot."],["git bundle","Scenario: no network access, need to transfer commits — packages the repo (or a range) into one portable file."],["git push --force-with-lease","Scenario: must force-push after a rebase, but don't want to clobber a teammate's new commits — refuses if the remote moved since you last fetched."],[".gitattributes","Scenario: Windows/Mac line-ending chaos in a shared repo — declares how git should normalize text files, binaries, and diffs per file type."],["git shortlog / describe","Scenario: writing release notes — shortlog summarizes commits per author, describe names the current commit relative to the nearest tag (e.g. v1.2.0-3-gabc1234)."],["git format-patch / git am","Scenario: contributing without a shared remote (email-based workflows, some kernel-style projects) — format-patch exports commits as .patch files, am applies them on the other end."],["git worktree list / remove / prune","Scenario: cleaning up after Phase 9's worktree add — list shows all active worktrees, remove/prune clear out the ones you're done with."],["git maintenance / repack","Scenario: a years-old repo feels sluggish — runs housekeeping (repacking objects, pruning) to keep it fast."]]},{"icon":"📁","name":"File & Working Tree","num":"12.1","desc":"Reference-tier commands for file & working tree — not daily-driver, but essential when the moment calls for them.","analogy":"","items":[["git mv <old> <new>","Scenario: renaming a file — moves it AND stages the rename in one step, so git tracks it as a rename not a delete+add."],["git rm <file>","Scenario: file should be deleted from both disk and git — removes and stages the deletion together."],["git clean -fd","Scenario: build artifacts and stray untracked files cluttering your working dir — force-deletes anything git doesn't track (dirs too)."],["git grep \"pattern\"","Scenario: searching code across the whole tracked tree fast, without leaving git's index."],["git ls-files","Scenario: \"what does git actually think is tracked here?\" — lists every tracked file."],["git check-ignore -v <file>","Scenario: a file refuses to be added — shows exactly which .gitignore rule is blocking it."],[".git/info/exclude","Scenario: want to ignore a file locally without touching the shared .gitignore — a private, per-clone ignore list."]]},{"icon":"🪄","name":"History Rewriting Extras","num":"12.2","desc":"Reference-tier commands for history rewriting extras — not daily-driver, but essential when the moment calls for them.","analogy":"","items":[["git commit --fixup <sha>","Scenario: small correction to an old commit before a PR — marks it for auto-squashing later."],["git rebase -i --autosquash","Scenario: several --fixup commits queued up — automatically folds each into its target during interactive rebase."],["git rebase --onto <newbase> <upstream> <branch>","Scenario: branch was built on the wrong base — surgically re-parents just the commits you want onto a different base."],["git commit --amend --no-edit","Scenario: forgot one file in the last commit, message is still fine — adds it without opening the editor."],["git commit --allow-empty","Scenario: need a commit with no file changes (e.g. to trigger CI) — creates one anyway."],["git filter-branch (legacy)","Scenario: old scripts still reference this — historically used to rewrite history in bulk; git filter-repo (Phase 10) replaces it, filter-branch is now discouraged."]]},{"icon":"🎯","name":"Staging & Diff Power Moves","num":"12.3","desc":"Reference-tier commands for staging & diff power moves — not daily-driver, but essential when the moment calls for them.","analogy":"","items":[["git add -p","Scenario: one file has 3 unrelated changes — interactively stage only some hunks, split the rest into a later commit."],["git add -A vs . vs -u","Scenario: unsure what \"stage everything\" actually stages — -A stages all changes repo-wide, . stages from current dir down, -u stages only already-tracked files."],["git stash -p","Scenario: only part of your working changes should be shelved — interactively pick which hunks go into the stash."],["git stash show -p","Scenario: \"what's actually inside that stash?\" — previews its diff without applying it."],["git stash branch <name>","Scenario: stashed work has since conflicted with main — creates a fresh branch from the stash point and replays it there cleanly."],["git diff --stat","Scenario: quick \"how big was this change?\" — file-by-file summary of insertions/deletions, no line detail."],["git log --stat","Scenario: reviewing history — shows which files each commit touched and by how much."],["git log --follow <file>","Scenario: tracing a file's history through a rename — keeps following it past the rename point."],["git log --grep=\"text\"","Scenario: \"which commit message mentioned the payment bug?\" — searches commit messages, not code."],["git log -- <path>","Scenario: history of ONE file or folder only, ignoring every other change in the repo."]]},{"icon":"🌐","name":"Branch & Remote Management","num":"12.4","desc":"Reference-tier commands for branch & remote management — not daily-driver, but essential when the moment calls for them.","analogy":"","items":[["git branch -m <old> <new>","Scenario: branch name has a typo — renames it in place."],["git branch --contains <sha>","Scenario: \"which branches have this fix?\" — lists every branch that includes a given commit."],["git branch -r / -a","Scenario: want to see remote-tracking branches too, not just local ones — -r shows remote, -a shows all."],["git remote rename/remove/set-url","Scenario: repo moved to a new host, or origin was misnamed — updates the remote's name or URL without re-cloning."],["git remote prune origin","Scenario: teammates deleted their branches on GitHub but your local remote-tracking refs still list them — cleans up the stale ones."],["git fetch --prune","Scenario: same cleanup, done automatically as part of every fetch."],["git pull --rebase","Scenario: want to sync with origin WITHOUT creating a merge bubble — replays your local commits on top instead of merging."],["git push --delete origin <branch>","Scenario: feature branch merged, want it gone from GitHub too — deletes the remote branch directly."],["git push --tags","Scenario: tags don't push automatically with commits — explicitly sends all local tags to the remote."],["git tag -d <name>","Scenario: tagged the wrong commit — deletes the local tag so you can redo it."],["git merge --no-ff","Scenario: opes blame to a line range instead of the whole file."]]},{"icon":"⚙️","name":"Config & Environment","num":"12.6","desc":"Reference-tier commands for config & environment — not daily-driver, but essential when the moment calls for them.","analogy":"","items":[["git config --local/--global/--system","Scenario: setting differ per-repo vs per-user vs machine-wide — three layers, local overrides global overrides system."],["core.editor / $GIT_EDITOR","Scenario: commit messages keep opening in the wrong editor — sets which one git launches for messages/rebases."],["GIT_AUTHOR_NAME / GIT_AUTHOR_EMAIL","Scenario: scripting commits with a specific identity (e.g. a bot) — env vars override config for that one command."],["git config --edit","Scenario: config file has many entries to tweak at once — opens it directly in your editor instead of one command per setting."],["credential.helper","Scenario: typing your GitHub password on every push — caches or stores credentials so git stops asking."]]},{"icon":"📮","name":"Collaboration Extras","num":"12.7","desc":"Reference-tier commands for collaboration extras — not daily-driver, but essential when the moment calls for them.","analogy":"","items":[["git request-pull","Scenario: no PR platform available — generates a summary text you can email describing what to pull and from where."],["git format-patch --stdout \\| git send-email","Scenario: fully email-based contribution workflow (e.g. Linux kernel style) — mails patches directly instead of pushing anywhere."],["git range-diff v1..v2 v1'..v2'","Scenario: \"how did my rebased branch's commits change vs before the rebase?\" — diffs two versions of a commit range against each other."],["git difftool / git mergetool","Scenario: terminal diffs too cramped to read — launches your configured GUI diff/merge tool instead."],["git instaweb","Scenario: want a quick local web UI to browse repo history — spins one up instantly, no server setup."]]},{"icon":"🧹","name":"Maintenance Extras","num":"12.8","desc":"Reference-tier commands for maintenance extras — not daily-driver, but essential when the moment calls for them.","analogy":"","items":[["git reflog expire --expire=now --all","Scenario: about to run gc and want the reflog safety net cleared first (rare, deliberate) — expires reflog entries early."],["git fsck --full","Scenario: deep corruption suspected — the thorough version of fsck, checks unreachable objects too."],["git gc --aggressive","Scenario: repo is old and huge, one-time deep optimization — repacks more thoroughly than default gc (slow, run rarely)."],["git prune","Scenario: loose unreachable objects taking up space after a hard reset/rebase — deletes objects nothing points to anymore."]]}];

/* flatten with stable ids */
const ALL = [];
CATEGORIES.forEach((cat, ci)=>{
  cat.items.forEach((it, ii)=>{
    ALL.push({ id: ci+'-'+ii, cat, catIndex: ci, cmd: it[0], scenario: it[1] });
  });
});

const navGroups = document.getElementById('navGroups');
const contentEl = document.getElementById('content');
const statsRow = document.getElementById('statsRow');
statsRow.innerHTML = `<span><b>${ALL.length}</b> commands</span><span>·</span><span><b>${CATEGORIES.length}</b> categories</span>`;

/* build sidebar */
CATEGORIES.forEach((cat, ci)=>{
  const li = document.createElement('li');
  li.className = 'nav-group';
  const details = document.createElement('details');
  details.open = ci === 0;
  details.innerHTML = `
    <summary><span class="gicon">${cat.icon}</span><span>${cat.name}</span><span class="gcount">${cat.items.length}</span><span class="chev">▸</span></summary>
    <ul class="nav-items">
      ${cat.items.map((it,ii)=>`<li><button class="nav-item" data-id="${ci}-${ii}">${it[0]}</button></li>`).join('')}
    </ul>
  `;
  li.appendChild(details);
  navGroups.appendChild(li);
});

navGroups.addEventListener('click', (e)=>{
  const btn = e.target.closest('.nav-item');
  if(!btn) return;
  render(btn.dataset.id);
});

/* search filter */
document.getElementById('searchInput').addEventListener('input', (e)=>{
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll('.nav-group').forEach((groupLi, ci)=>{
    const details = groupLi.querySelector('details');
    const items = groupLi.querySelectorAll('.nav-item');
    let anyMatch = false;
    items.forEach(btn=>{
      const cat = CATEGORIES[ci];
      const idx = parseInt(btn.dataset.id.split('-')[1],10);
      const hay = (cat.items[idx][0] + ' ' + cat.items[idx][1] + ' ' + cat.name).toLowerCase();
      const match = !q || hay.includes(q);
      btn.parentElement.style.display = match ? '' : 'none';
      if(match) anyMatch = true;
    });
    groupLi.style.display = anyMatch ? '' : 'none';
    if(q && anyMatch) details.open = true;
  });
});

         <path d="M62 70 L82 88 L102 70" fill="none" stroke="${c1}" stroke-width="2"/>
       </g>`,
    ],
    [ // 7 sweep
      `       <circle cx="42" cy="60" r="6" fill="rgba(248,113,113,0.25)" stroke="${c4}"/>`,
      `<circle cx="58" cy="102" r="6" fill="rgba(248,113,113,0.25)" stroke="${c4}" style="animation:sweepOff .7s ease forwards"/>
       <circle cx="36" cy="118" r="6" fill="rgba(248,113,113,0.25)" stroke="${c4}" style="animation:sweepOff .7s ease forwards .08s"/>`,
      `<text x="82" y="150" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.4)">3. swept clean</text>`,
    ],
  ];
  return STYLE_STEPS[styleIdx % STYLE_STEPS.length];
}

function renderIcon(container, catIndex, seed, upToStep){
  const steps = getSteps(catIndex % 8, seed);
  const html = steps.slice(0, upToStep+1).join('');
  container.innerHTML = `<svg viewBox="0 0 164 170" width="160" height="160">${html}</svg>`;
}

/* ---- realistic worked code example per command (verb-detected, not generic filler) ---- */
function generateExample(cmd){
  const c = cmd.toLowerCase();
  const rules = [
    [/git init/, `$ git init\nInitialized empty Git repository in ./.git/`],
    [/git status/, `$ git status\nOn branch main\nChanges not staged for commit:\n  modified:   src/app.js\n\nno changes added to commit`],

    [/git commit/, `$ git commit -m "feat: add login validation"\n[main 7f3a9c1] feat: add login validation\n 1 file changed, 12 insertions(+)`],

    [/git branch -d|git branch -D/, `$ git branch -d feature/login\nDeleted branch feature/login (was 7f3a9c1).`],
    [/git branch/, `$ git branch feature/login\n$ git branch\n  main\n* feature/login`],
    [/git switch -c|git checkout -b/, `$ git switch -c feature/login\nSwitched to a new branch 'feature/login'`],

    [/git merge.*squash/, `$ git merge --squash feature/login\nSquash commit -- not updating HEAD\nAutomatic merge went well`],

    [/git clone/, `$ git clone https://github.com/you/repo.git\nCloning into 'repo'...\nremote: Enumerating objects: 240, done.`],
    [/git rebase -i|autosquash/, `$ git rebase -i HEAD~4\npick 7f3a9c1 feat: login form\nsquash a1b2c3d wip\nsquash e9d0b21 wip\nreword 4e2f1a0 fix typo`],

    [/git shortlog/, `$ git shortlog -sn\n   42  Ashish Patel\n   11  Priya Sharma`],
    [/git gc --aggressive/, `$ git gc --aggressive\nEnumerating objects: 500, done.\nCompressing objects: 100%`],

    [/credential/, `$ git config --global credential.helper cache\n# git stops asking for your password every push`],

    [/-S -m|signed|commit -s/, `$ git commit -S -m "feat: add login validation"\n[main 7f3a9c1] feat: add login validation\n(gpg: signature verified)`],
    [/pre-commit/, `$ git commit -m "feat: add API key"\n✗ pre-commit hook: forbidden pattern "API_KEY=" found\ncommit rejected`],
    [/alias/, `$ git config --global alias.co switch\n$ git co main\nSwitched to branch 'main'`],
    [/conventional commits/, `$ git commit -m "fix: correct off-by-one error in pagination"\n# machine-readable type prefix for changelog tools`],
    [/git flow|trunk-based/, `main ──●──●──●──●──●──   (everyone commits behind feature flags)\nfeature/x  ╰──●──●╯       (short-lived, merges fast)`],
    [/fork vs clone/, `# fork: github.com/you/repo (your copy)\n$ git clone https://github.com/you/repo.git\n$ git remote add upstream https://github.com/original/repo.git`],
    [/pull request/, `# on GitHub: Compare & pull request\n# feature/login -> main, reviewers requested`],
    [/git \.\.\.|open pull|merge pr/, `# reviewed, approved, "Squash and merge" clicked on GitHub`],
    [/git lfs/, `$ git lfs track "*.psd"\n$ git add .gitattributes design.psd\n$ git commit -m "track large binary asset"`],
    [/git subtree/, `$ git subtree add --prefix=libs/shared https://github.com/org/shared.git main --squash`],
  ];
  for(const [re, out] of rules){ if(re.test(c)) return out; }
  return `$ ${cmd.replace(/<[^>]+>/g,'<arg>')}\n# runs against the current repository`;
}

let currentIndex = -1;
let currentStep = 0;
function render(id){
  const item = ALL.find(x=>x.id===id);
  if(!item) return;
  currentIndex = ALL.indexOf(item);

  document.querySelectorAll('.nav-item').forEach(b=>b.removeAttribute('aria-current'));
  const activeBtn = document.querySelector(`.nav-item[data-id="${id}"]`);
  if(activeBtn) activeBtn.setAttribute('aria-current','true');

  const cat = item.cat;
  contentEl.innerHTML = `
    <div class="crumb"><span>${cat.icon} ${cat.name}</span><span class="sep">/</span><span class="cur">${item.cmd}</span></div>
    <h1 class="cmd-title">${item.cmd}</h1>
    <div class="cat-context">
      <div class="eyebrow">about this room</div>
      <p>${cat.desc}</p>
      ${cat.analogy ? `<div class="analogy-line">${cat.analogy}</div>` : ''}
    </div>
    <div class="scenario-card">
      <div class="label">Scenario</div>
      <p>${item.scenario}</p>
    </div>
    <div class="panel" style="margin-bottom:var(--space-10);">
      <div class="panel-head"><span>Code example</span><span>worked session</span></div>
      <div class="terminal-body" id="codeExample" style="min-height:auto;"></div>
    </div>
    <div class="stage-grid">
      <div class="panel">
        <div class="panel-head"><span>Animation</span><span id="stepLabel">step 1 / 3</span></div>
        <div class="icon-stage" id="iconStage"></div>
        <div id="stepCaption" style="padding:0 var(--space-10); margin-bottom:var(--space-6); min-height:1.4em; font-size:12px; color:var(--color-text-tertiary);"></div>
        <div class="btn-row" style="padding:0 var(--space-10) var(--space-10);">
          <button class="btn" id="stepPrevBtn">◂ Step</button>
          <button class="btn" id="stepNextBtn">Step ▸</button>
          <button class="btn primary" id="replayBtn">▶ Autoplay</button>
        </div>
      </div>
      <div class="panel">
        <div class="panel-head"><span>Terminal</span><span>replay</span></div>
        <div class="terminal-body" id="termBody"><span class="prompt">$</span> <span class="tcursor"></span></div>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn" id="prevBtn" ${currentIndex<=0?'disabled':''}>← Previous command</button>
      <button class="btn" id="nextBtn" ${currentIndex>=ALL.length-1?'disabled':''}>Next command →</button>
    </div>
    <div class="related-title">More in ${cat.name}</div>
    <ul class="related-list">
      ${cat.items.map((it,ii)=>{
        const rid = item.catIndex+'-'+ii;
        return rid===id ? '' : `<li class="related-item" data-id="${rid}"><code>${it[0]}</code><span>${it[1]}</span></li>`;
      }).join('')}
    </ul>
  `;

  const iconStage = document.getElementById('iconStage');
  const termBody = document.getElementById('termBody');
  const stepLabel = document.getElementById('stepLabel');
  const totalSteps = 3;
  currentStep = 0;

  document.getElementById('codeExample').innerHTML =
    generateExample(item.cmd).split('\n').map((line,i)=>
      i===0 ? `<span class="typed">${line}</span>` : `<span class="out">${line}</span>`
    ).join('<br>');

  const stepCaptionEl = document.getElementById('stepCaption');
  function showStep(n){
    currentStep = Math.max(0, Math.min(totalSteps-1, n));
    renderIcon(iconStage, item.catIndex, id, currentStep);
    stepLabel.textContent = `step ${currentStep+1} / ${totalSteps}`;
    stepCaptionEl.textContent = STEP_CAPTIONS[item.catIndex % 8][currentStep];
    document.getElementById('stepPrevBtn').disabled = currentStep===0;
    document.getElementById('stepNextBtn').disabled = currentStep===totalSteps-1;
  }
  function typeTerminal(){
    termBody.innerHTML = '<span class="typed"></span><span class="tcursor"></span>';
    const typedEl = termBody.querySelector('.typed');
    let i = 0;
    (function type(){
      if(i <= item.cmd.length){ typedEl.textContent = item.cmd.slice(0,i); i++; setTimeout(type, 16); }
      else{ termBody.innerHTML = `<span class="typed">${item.cmd}</span><br><span class="out">${item.scenario}</span>`; }
    })();
  }
  function autoplay(){
    let n = 0;
    showStep(0);
    const iv = setInterval(()=>{
      n++;
      if(n>=totalSteps){ clearInterval(iv); return; }
      showStep(n);
    }, 700);
    typeTerminal();
  }

  showStep(0);
  typeTerminal();
  document.getElementById('replayBtn').addEventListener('click', autoplay);
  document.getElementById('stepPrevBtn').addEventListener('click', ()=>showStep(currentStep-1));
  document.getElementById('stepNextBtn').addEventListener('click', ()=>showStep(currentStep+1));
  document.getElementById('prevBtn').addEventListener('click', ()=>{ if(currentIndex>0) render(ALL[currentIndex-1].id); window.scrollTo(0,0); });
  document.getElementById('nextBtn').addEventListener('click', ()=>{ if(currentIndex<ALL.length-1) render(ALL[currentIndex+1].id); window.scrollTo(0,0); });
  contentEl.querySelectorAll('.related-item').forEach(el=>{
    el.addEventListener('click', ()=>{ render(el.dataset.id); window.scrollTo(0,0); });
  });

  /* keyboard: ← → step the animation, Shift+←/→ change command */
  document.onkeydown = (e)=>{
    if(e.target.tagName==='INPUT') return;
    if(e.key==='ArrowRight'){ e.shiftKey ? document.getElementById('nextBtn').click() : showStep(currentStep+1); }
    if(e.key==='ArrowLeft'){ e.shiftKey ? document.getElementById('prevBtn').click() : showStep(currentStep-1); }
  };

  const activeDetails = activeBtn ? activeBtn.closest('details') : null;
  if(activeDetails) activeDetails.open = true;
  history.replaceState(null, '', '#'+id);
}

/* initial render: from hash or first command */
const initId = (location.hash||'').replace('#','') || ALL[0].id;
if(ALL.find(x=>x.id===initId)) render(initId);
else render(ALL[0].id);
</script>
