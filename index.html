/* map each command to its drill (same verb rules as scenes; nearest drill when the op isn't sandboxable) */
function getExercise(cmd){
  const c = cmd.toLowerCase();
  const rules = [
    [/amend|commit/, 'commit'],
    [/reset|restore|clean|gc|prune|fsck|maintenance|repack|rm |rm$|reflog/, 'reset'],
    [/revert/, 'revert'],
    [/rebase|fixup|autosquash|filter-|range-diff/, 'rebase'],
    [/cherry/, 'cherry'],
    [/merge --no-ff|merge <branch> \(fast/, 'mergeff'],
    [/merge|pull request|open pull|merge pr/, 'merge'],
    [/branch|switch|checkout|worktree|submodule|subtree|sparse|stash/, 'branch'],
    [/tag|describe|shortlog/, 'tag'],
    [/push|remote|fetch|pull|clone|tracking|fork/, 'mergeff'],
    [/bisect|blame|log|diff|show|grep|status|ls-|cat-file|rev-parse|merge-base/, 'commit'],
  ];
  let key = 'commit';
  for(const [re,k] of rules){ if(re.test(c)){ key = k; break; } }
  return { key, ex: EXERCISES[key] };
}

/* ============================================================
   PRACTICE ARENA — 100+ generated scenario drills
   ============================================================ */
function buildArena(){
  const E = [];
  const add = (level, title, story, setup, goal, hint, win) =>
    E.push({ id: E.length, level, title, story, setup, goal, hint, win });
  const B='Beginner', I='Intermediate', A='Advanced';
  const twoParents = (r,br='main') => (r.commits[r.branches[br]]?.parents || []).length === 2;
  const onePar = (r,br='main') => (r.commits[r.branches[br]]?.parents || []).length < 2;

  /* --- commit reps (5) --- */
  [['first day at a startup — save your initial work',1],
   ['the README and the config file each deserve their own snapshot',2],
   ['three separate bug fixes, three separate save points',3],
   ['a productive morning: four features, four commits',4],
   ['end-to-end prototype built — checkpoint all five stages',5]
  ].forEach(([story,n])=>add(B, `Make ${n} commit${n>1?'s':''} on main`, `Scenario: ${story}.`,
    [], r=>r.seq>=n && r.head==='main', `Run <code>git commit</code> ${n} time${n>1?'s':''}.`, `${n} snapshot${n>1?'s':''} saved — each one a permanent save point.`));

  /* --- branch creation (8) --- */
  const branchStories = {
    feature:'a new search feature was approved', bugfix:'QA found a nasty off-by-one', hotfix:'production is down',
    release:'v2 ships next week and needs isolation', experiment:'you want to try a risky refactor safely',
    docs:'the API docs need a rewrite', payments:'the payments integration starts today', login:'the login flow gets a redesign',
    search:'search results ranking needs an overhaul', api:'the public API gets versioned endpoints'};
  Object.entries(branchStories).forEach(([b,story])=>add(B, `Create a branch named ${b}`, `Scenario: ${story} — main must stay untouched.`,
    ['git commit','git commit'], r=>!!r.branches[b], `<code>git branch ${b}</code>`, `Branch '${b}' now labels the same commit as main — zero cost until you commit on it.`));

  /* --- create + switch (8) --- */
  Object.entries(branchStories).forEach(([b,story])=>add(B, `Create AND switch to ${b} in one move`, `Scenario: ${story} — and you want to start working on it immediately.`,
    ['git commit'], r=>r.head===b, `<code>git switch -c ${b}</code> (one command).`, `-c created the branch and moved HEAD onto it in a single step.`));

  /* --- commit on a branch (8) --- */
  Object.keys(branchStories).forEach((b,i)=>{
    const n = (i%3)+1;
    add(B, `Do ${n} commit${n>1?'s':''} of work on ${b}`, `Scenario: the ${b} work is underway — commit progress there while main stays frozen.`,
      ['git commit'], r=>r.head===b && r.branches[b] && r.branches[b]!==r.branches.main && r.seq>=n+1,
      `<code>git switch -c ${b}</code>, then <code>git commit</code> ×${n}.`, `${b} diverged from main by ${n} commit${n>1?'s':''}.`);
  });

  /* --- switch back and forth (4) --- */
  [['feature','you forgot a config change on main'],['hotfix','mid-hotfix you need to check something on main'],
   ['release','swap over to main to review'],['experiment','abandon the experiment view for a moment']
  ].forEach(([b,story])=>add(B, `Work on ${b}, then return to main`, `Scenario: ${story}.`,
    ['git commit',`git branch ${b}`,`git switch ${b}`,'git commit'], r=>r.head==='main',
    `<code>git switch main</code>`, `HEAD is a movable "you are here" marker — switching is instant.`));

  /* --- fast-forward merges (8) --- */
  Object.keys(branchStories).forEach((b,i)=>{
    const ahead = (i%3)+1;
    add(I, `Fast-forward merge ${b} into main`, `Scenario: ${b} is ${ahead} commit${ahead>1?'s':''} ahead and main hasn't moved — git won't even need a merge commit.`,
      ['git commit',`git switch -c ${b}`,...Array(ahead).fill('git commit'),'git switch main'],
      r=>r.branches.main===r.branches[b] && onePar(r), `<code>git merge ${b}</code> — watch main's label just slide forward.`,
      `Fast-forward: no merge commit, main simply caught up.`);
  });

  /* --- 3-way merges (8) --- */
  Object.keys(branchStories).forEach((b,i)=>{
    const bn=(i%2)+1, mn=(i%2)+1;
    add(I, `Three-way merge: ${b} into main`, `Scenario: both ${b} AND main moved since the fork — a real merge commit is required.`,
      ['git commit',`git branch ${b}`,`git switch ${b}`,...Array(bn).fill('git commit'),'git switch main',...Array(mn).fill('git commit')],
      r=>twoParents(r), `You're on main — <code>git merge ${b}</code>.`,
      `Two-parent merge commit created — both timelines preserved.`);
  });

  /* --- merge main INTO feature (4) --- */
  ['feature','payments','login','experiment'].forEach(b=>add(I, `Sync ${b} with main (merge main in)`, `Scenario: main got important fixes while you worked on ${b} — pull them INTO your branch.`,
    ['git commit',`git branch ${b}`,`git switch ${b}`,'git commit','git switch main','git commit',`git switch ${b}`],
    r=>r.head===b && twoParents(r,b), `You're on ${b} — <code>git merge main</code>.`,
    `${b} now contains main's fixes — direction matters: you merged INTO ${b}.`));

  /* --- rebase (8) --- */
  Object.keys(branchStories).forEach((b,i)=>{
    const n=(i%2)+1;
    add(A, `Rebase ${b} onto main`, `Scenario: main moved on while you made ${n} commit${n>1?'s':''} on ${b} — replay your work for a straight-line history.`,
      ['git commit',`git branch ${b}`,`git switch ${b}`,...Array(n).fill('git commit'),'git switch main','git commit',`git switch ${b}`],
      r=>String(r.branches[b]).includes("'") && r.isAncestor(r.branches.main, r.branches[b]),
      `You're on ${b} — <code>git rebase main</code>. Watch the NEW commit ids.`,
      `Replayed with new ids — history reads as one straight line now.`);
  });

  /* --- rebase then fast-forward (4) --- */
  ['feature','bugfix','payments','docs'].forEach(b=>add(A, `Rebase ${b}, then fast-forward main`, `Scenario: the gold-standard clean flow — rebase your branch, then main merges it with zero merge commits.`,
    ['git commit',`git branch ${b}`,`git switch ${b}`,'git commit','git switch main','git commit',`git switch ${b}`],
    r=>r.branches.main===r.branches[b] && String(r.branches.main).includes("'"),
    `<code>git rebase main</code> → <code>git switch main</code> → <code>git merge ${b}</code>.`,
    `Linear history, no merge bubble — the trunk-based dream.`));

  /* --- reset (6) --- */
  [[1,'the last commit broke the build'],[2,'the last two commits were a dead end'],[3,'the whole afternoon was a wrong turn'],
   [1,'you committed a debug print by mistake'],[2,'both "wip" commits need to go'],[1,'that commit belongs on a branch, not main']
  ].forEach(([n,story],i)=>{
    const total=n+1+(i%2);
    add(I, `Throw away the last ${n} commit${n>1?'s':''}`, `Scenario: ${story} — main must point at c${total-n}.`,
      Array(total).fill('git commit'), r=>r.branches.main===('c'+(total-n)),
      `<code>git reset --hard HEAD~${n}</code>`, `Label rewound — the orphaned commit${n>1?'s':''} faded away.`);
  });

  /* --- revert (5) --- */
  [['the bad commit is already on the shared server'],['teammates pulled it an hour ago'],['CI already deployed it'],
   ['you must keep the audit trail intact'],['company policy: never rewrite pushed history']
  ].forEach(story=>add(I, 'Undo the last commit — WITHOUT rewriting history', `Scenario: ${story} — reset is forbidden.`,
    ['git commit','git commit'], r=>String(r.commits[r.branches.main]?.hashLabel||'').startsWith('!'),
    `<code>git revert HEAD</code> — adds an anti-commit.`, `Effect cancelled, history intact — the safe undo for shared branches.`));

  /* --- cherry-pick (6) --- */
  [['feature','c2','the fix on feature is needed on main NOW'],['bugfix','c2','one commit from bugfix must ship today'],
   ['hotfix','c2','grab the hotfix commit without its branch'],['payments','c2','the validation fix applies to main too'],
   ['experiment','c2','one good idea came out of the experiment'],['login','c2','the session fix is branch-independent']
  ].forEach(([b,pick,story])=>add(A, `Cherry-pick ${pick} from ${b}`, `Scenario: ${story} — you don't want the whole branch, just that commit.`,
    ['git commit',`git branch ${b}`,`git switch ${b}`,'git commit','git switch main'],
    r=>r.commits[pick+"'"] && r.isAncestor(pick+"'", r.branches.main),
    `You're on main — <code>git cherry-pick ${pick}</code>.`, `Copied across as ${pick}' — the original stayed on ${b}.`));

  /* --- tags (6) --- */
  ['v1.0','v1.1','v2.0','v2.1.3','v3.0-beta','v1.0.1'].forEach((v,i)=>add(B, `Tag the release as ${v}`, `Scenario: ${i%2?'the release manager needs a permanent marker':'ship it — mark this exact commit forever'}.`,
    Array((i%3)+1).fill('git commit'), r=>!!r.tags[v],
    `<code>git tag ${v}</code>`, `${v} pinned — branches move, tags never do.`));

  /* --- combo flows (12) --- */
  add(A,'The hotfix flow, end to end','Scenario: production broke. Branch off, fix it, merge it back — the full emergency loop.',
    ['git commit','git commit'], r=>r.branches.hotfix && r.branches.main===r.branches.hotfix,
    `<code>git switch -c hotfix</code> → <code>git commit</code> → <code>git switch main</code> → <code>git merge hotfix</code>.`,
    'The complete hotfix loop: isolate, fix, integrate.');
  add(A,'Release: merge + tag','Scenario: feature is done and reviewed — integrate it into main and stamp the release.',
    ['git commit','git branch feature','git switch feature','git commit','git switch main','git commit'],
    r=>twoParents(r) && Object.keys(r.tags).length>0,
    `<code>git merge feature</code>, then <code>git tag v1.0</code>.`, 'Merged and tagged — a complete release.');
  add(A,'Two features, two merges','Scenario: two teammates finished simultaneously — integrate both branches into main.',
    ['git commit','git branch alpha','git switch alpha','git commit','git switch main','git branch beta','git switch beta','git commit','git switch main','git commit'],
    r=>{const m=r.branches.main; const p1=(r.commits[m]?.parents||[]); if(p1.length!==2) return false; return r.isAncestor(r.branches.alpha,m)&&r.isAncestor(r.branches.beta,m);},
    `<code>git merge alpha</code> then <code>git merge beta</code> (each may need its own merge commit).`,
    'Both timelines integrated — main contains everything.');
  add(A,'Wrong branch! Move the commit','Scenario: you committed on main but it belongs on feature — copy it over, then erase it from main.',
    ['git commit','git branch feature','git commit'],
    r=>r.commits["c2'"] && r.isAncestor("c2'", r.branches.feature) && r.branches.main==='c1',
    `<code>git switch feature</code> → <code>git cherry-pick c2</code> → <code>git switch main</code> → <code>git reset --hard HEAD~1</code>.`,
    'Commit relocated — classic recovery move.');
  add(A,'Undo, redo better','Scenario: last commit was wrong. Remove it, then commit a corrected version.',
    ['git commit','git commit'], r=>r.branches.main!=='c2' && !String(r.branches.main).includes("'") && r.seq>=3 && r.branches.main==='c3' && r.commits.c3.parents[0]==='c1',
    `<code>git reset --hard HEAD~1</code> then <code>git commit</code>.`, 'Old attempt gone, better one in its place.');
  add(A,'Stack two branches','Scenario: build feature-b on top of feature-a (a stacked PR).',
    ['git commit'], r=>r.branches['feature-a'] && r.branches['feature-b'] && r.isAncestor(r.branches['feature-a'], r.branches['feature-b']) && r.branches['feature-b']!==r.branches['feature-a'],
    `<code>git switch -c feature-a</code> → commit → <code>git switch -c feature-b</code> → commit.`,
    'feature-b contains feature-a — a stacked branch.');
  add(A,'Merge, then keep working','Scenario: merge feature into main, then continue with one more commit on main.',
    ['git commit','git branch feature','git switch feature','git commit','git switch main','git commit'],
    r=>{let id=r.branches.main; const c=r.commits[id]; if(!c||c.parents.length!==1) return false; return (r.commits[c.parents[0]]?.parents||[]).length===2;},
    `<code>git merge feature</code> then <code>git commit</code>.`, 'Life continues after the merge.');
  add(A,'Tag before AND after','Scenario: tag v1.0 now, commit a fix, tag v1.0.1 — two markers, two commits.',
    ['git commit'], r=>r.tags['v1.0'] && r.tags['v1.0.1'] && r.tags['v1.0']!==r.tags['v1.0.1'],
    `<code>git tag v1.0</code> → <code>git commit</code> → <code>git tag v1.0.1</code>.`, 'Two frozen release markers on different commits.');
  add(A,'Rescue with revert ×2','Scenario: the last TWO commits are both bad and both pushed — cancel each without rewriting.',
    ['git commit','git commit','git commit'],
    r=>{let id=r.branches.main,count=0; while(id && String(r.commits[id]?.hashLabel||'').startsWith('!')){count++; id=r.commits[id].parents[0];} return count>=2;},
    `<code>git revert HEAD</code> twice.`, 'Two anti-commits — audit trail fully intact.');
  add(A,'Fork, diverge, reconcile','Scenario: the full lifecycle — branch, both sides commit, merge back together.',
    ['git commit'], r=>twoParents(r) && Object.keys(r.branches).length>=2,
    `<code>git switch -c topic</code> → commit → <code>git switch main</code> → commit → <code>git merge topic</code>.`,
    'You just ran the entire collaborative loop solo.');
  add(A,'Triple branch juggle','Scenario: create three branches (a, b, c) all pointing at today\'s tip — planning tomorrow\'s work.',
    ['git commit','git commit'], r=>r.branches.a && r.branches.b && r.branches.c,
    `<code>git branch a</code>, <code>git branch b</code>, <code>git branch c</code>.`,
    'Three zero-cost labels — branches are cheap, use them freely.');
  add(A,'The long game','Scenario: build a history of at least 8 commits across main and one feature branch, merged at the end.',
    [], r=>r.seq>=8 && twoParents(r),
    `Commit several times, branch, commit more, merge back. Any path works — reach 8 commits + a merge.`,
    'A realistic week of history, built by hand.');

  return E;
}

function renderDrill(idx){
  const ex = ARENA[idx];
  if(!ex){ renderArena(); return; }
  document.onkeydown = null;
  document.querySelectorAll('.nav-item').forEach(b=>b.removeAttribute('aria-current'));
  const abtn = document.getElementById('arenaNavBtn');
  if(abtn) abtn.setAttribute('aria-current','true');
  contentEl.innerHTML = `
    <header class="command-header">
      <nav class="crumb" aria-label="Breadcrumb"><button type="button" id="backToArena">Practice Arena</button><span class="sep">/</span><span class="cur">${ex.level} · drill ${idx+1}</span></nav>
      <h1 class="cmd-title">${ex.title}</h1>
    </header>
    <div class="command-overview">
      <div class="scenario-card"><div class="label">Repository story</div><p>${ex.story}</p></div>
      <div class="cat-context"><div class="eyebrow">How validation works</div><p>Your command changes a real commit graph. The drill passes only when the target repository state is true.</p></div>
    </div>
    <section class="panel graph-panel practice-panel">
      <div class="panel-head"><span>Target repository</span><span id="exStatus" role="status">In progress</span></div>
      <div class="icon-stage" id="exStage"></div>
      <div class="result-message" id="exMsg" aria-live="polite"></div>
      <div class="command-bar">
        <span class="command-prompt" aria-hidden="true">$</span>
        <input class="search-input command-input" id="exInput" type="text" autocomplete="off" spellcheck="false"
          placeholder="Type a Git command to change the graph…" aria-label="Drill command input">
        <button class="btn primary" id="exRun" type="button">Run</button>
      </div>
      <div class="btn-row practice-actions">
        <button class="btn" id="exHint" type="button">Show hint</button>
        <button class="btn" id="exReset" type="button">↺ Restart</button>
        <button class="btn" id="exNext" type="button">Next drill →</button>
      </div>
    </section>
  `;
  document.getElementById('backToArena').addEventListener('click', ()=>renderArena(ex.level));
  document.getElementById('exNext').addEventListener('click', ()=>{ renderDrill((idx+1)%ARENA.length); window.scrollTo(0,0); });
  const stage = document.getElementById('exStage');
  const msgEl = document.getElementById('exMsg');
  const statusEl = document.getElementById('exStatus');
  const input = document.getElementById('exInput');
  let repo, solved;
  function refresh(){
    drawGraph(stage, repo.toStep());
    statusEl.textContent = solved ? 'Passed' : `HEAD → ${repo.head} @ ${repo.tip()}`;
    statusEl.style.color = solved ? 'var(--accent-2)' : '';
  }
  function start(){
    repo = newRepo(ex.setup); solved = false;
    msgEl.textContent = 'Repo prepared. Reach the goal.';
    msgEl.style.color = 'var(--color-text-tertiary)';
    input.disabled = false;
    refresh();
    input.focus();
  }
  function run(cmd){
    if(!cmd.trim() || solved) return;
    repo.exec(cmd);
    if(ex.goal(repo)){
      solved = true;
      msgEl.innerHTML = '<b>Passed.</b> ' + ex.win;
      msgEl.style.color = 'var(--accent-2)';
      input.disabled = true;
      confettiBurst(stage);
      const d = arenaDone(); d[ex.id] = true;
      localStorage.setItem(ARENA_KEY, JSON.stringify(d));
    } else {
      msgEl.textContent = repo.msg || '…';
      msgEl.style.color = repo.ok ? 'var(--color-text-secondary)' : 'var(--accent-danger)';
    }
    refresh();
    input.value = '';
    if(!solved) input.focus();
  }
  document.getElementById('exRun').addEventListener('click', ()=>run(input.value));
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') run(input.value); });
  document.getElementById('exHint').addEventListener('click', ()=>{ msgEl.innerHTML = '<b>Hint:</b> ' + ex.hint; msgEl.style.color = 'var(--accent-warn)'; });
  document.getElementById('exReset').addEventListener('click', start);
  start();
  history.replaceState(null, '', '#arena-'+idx);
}

    <section class="panel practice-panel">
      <div class="panel-head"><span>Hands-on repository</span><span id="exStatus" role="status">Drill in progress</span></div>
      <div class="practice-task" id="exTask"></div>
      <div class="icon-stage" id="exStage"></div>
      <div class="result-message" id="exMsg" aria-live="polite"></div>
      <div class="command-bar">
        <span class="command-prompt" aria-hidden="true">$</span>
        <input class="search-input command-input" id="exInput" type="text" autocomplete="off" spellcheck="false"
          placeholder="Type the command that reaches the target state…" aria-label="Exercise command input">
        <button class="btn primary" id="exRun" type="button">Run</button>
      </div>
      <div class="btn-row practice-actions">
        <button class="btn" id="exHint" type="button">Show hint</button>
        <button class="btn" id="exReset" type="button">↺ Restart drill</button>
      </div>
    </section>
    <div class="btn-row pager" aria-label="Command navigation">
      <button class="btn" id="prevBtn" type="button" ${currentIndex<=0?'disabled':''}>← Previous command</button>
      <button class="btn" id="nextBtn" type="button" ${currentIndex>=ALL.length-1?'disabled':''}>Next command →</button>
    </div>
    <div class="related-title">More in ${cat.name}</div>
    <ul class="related-list">
      ${cat.items.map((it,ii)=>{
        const rid = item.catIndex+'-'+ii;
        return rid===id ? '' : `<li><button class="related-item" type="button" data-id="${rid}"><code>${it[0]}</code><span>${it[1]}</span></button></li>`;
      }).join('')}
    </ul>
  `;

  const iconStage = document.getElementById('iconStage');
  const termBody = document.getElementById('termBody');
  const stepLabel = document.getElementById('stepLabel');
  const totalSteps = 3;
  currentStep = 0;

  document.getElementById('codeExample').innerHTML =
    generateExample(item.cmd).split('\n').map((line,i)=>
      i===0 ? `<span class="typed">${line}</span>` : `<span class="out">${line}</span>`
    ).join('<br>');

  const stepCaptionEl = document.getElementById('stepCaption');
  const scene = getScene(item.cmd);
  function showStep(n){
    currentStep = Math.max(0, Math.min(totalSteps-1, n));
    drawGraph(iconStage, scene[Math.min(currentStep, scene.length-1)]);
    stepLabel.textContent = `Step ${currentStep+1} / ${totalSteps}`;
    stepCaptionEl.textContent = scene[Math.min(currentStep, scene.length-1)].note || '';
    document.getElementById('stepPrevBtn').disabled = currentStep===0;
    document.getElementById('stepNextBtn').disabled = currentStep===totalSteps-1;
  }
  function typeTerminal(){
    termBody.innerHTML = '<span class="typed"></span><span class="tcursor"></span>';
    const typedEl = termBody.querySelector('.typed');
    let i = 0;
    (function type(){
      if(i <= item.cmd.length){ typedEl.textContent = item.cmd.slice(0,i); i++; setTimeout(type, 16); }
      else{ termBody.innerHTML = `<span class="typed">${item.cmd}</span><br><span class="out">${item.scenario}</span>`; }
    })();
  }
  function autoplay(){
    let n = 0;
    showStep(0);
    const iv = setInterval(()=>{
      n++;
      if(n>=totalSteps){ clearInterval(iv); return; }
      showStep(n);
    }, 700);
    typeTerminal();
  }

  showStep(0);
  typeTerminal();
  document.getElementById('replayBtn').addEventListener('click', autoplay);
  document.getElementById('stepPrevBtn').addEventListener('click', ()=>showStep(currentStep-1));
  document.getElementById('stepNextBtn').addEventListener('click', ()=>showStep(currentStep+1));
  document.getElementById('prevBtn').addEventListener('click', ()=>{ if(currentIndex>0) render(ALL[currentIndex-1].id); window.scrollTo(0,0); });
  document.getElementById('nextBtn').addEventListener('click', ()=>{ if(currentIndex<ALL.length-1) render(ALL[currentIndex+1].id); window.scrollTo(0,0); });
  contentEl.querySelectorAll('.related-item').forEach(el=>{
    el.addEventListener('click', ()=>{ render(el.dataset.id); window.scrollTo(0,0); });
  });

  /* ---- Learn by doing drill ---- */
  (function initExercise(){
    const { ex } = getExercise(item.cmd);
    const stage = document.getElementById('exStage');
    const taskEl = document.getElementById('exTask');
    const msgEl = document.getElementById('exMsg');
    const statusEl = document.getElementById('exStatus');
    const input = document.getElementById('exInput');
    let repo, done;
    function refresh(){
      drawGraph(stage, repo.toStep());
      statusEl.textContent = done ? 'Passed' : `HEAD → ${repo.head} @ ${repo.tip()}`;
      statusEl.style.color = done ? 'var(--accent-2)' : '';
    }
    function start(){
      repo = newRepo(ex.setup);
      done = false;
      taskEl.innerHTML = ex.task;
      msgEl.textContent = 'Repo prepared. Type your command below.';
      msgEl.style.color = 'var(--color-text-tertiary)';
      input.disabled = false;
      refresh();
    }
    function run(cmd){
      if(!cmd.trim() || done) return;
      repo.exec(cmd);
      if(ex.goal(repo)){
        done = true;
        repo.msg = '';
        msgEl.innerHTML = '<b>Passed.</b> ' + ex.win;
        msgEl.style.color = 'var(--accent-2)';
        input.disabled = true;
        confettiBurst(stage);
      } else {
        msgEl.textContent = repo.msg || '…';
        msgEl.style.color = repo.ok ? 'var(--color-text-secondary)' : 'var(--accent-danger)';
      }
      refresh();
      input.value = '';
      if(!done) input.focus();
    }
    document.getElementById('exRun').addEventListener('click', ()=>run(input.value));
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') run(input.value); });
    document.getElementById('exHint').addEventListener('click', ()=>{
      msgEl.innerHTML = '<b>Hint:</b> ' + ex.hint;
      msgEl.style.color = 'var(--accent-warn)';
    });
    document.getElementById('exReset').addEventListener('click', start);
    start();
  })();

  /* keyboard: ← → step the animation, Shift+←/→ change command */
  document.onkeydown = (e)=>{
    if(e.target.tagName==='INPUT') return;
    if(e.key==='ArrowRight'){ e.shiftKey ? document.getElementById('nextBtn').click() : showStep(currentStep+1); }
    if(e.key==='ArrowLeft'){ e.shiftKey ? document.getElementById('prevBtn').click() : showStep(currentStep-1); }
  };

  const activeDetails = activeBtn ? activeBtn.closest('details') : null;
  if(activeDetails) activeDetails.open = true;
  history.replaceState(null, '', '#'+id);
}

/* initial render: from hash, playground, arena, or first command */
const initId = (location.hash||'').replace('#','') || ALL[0].id;
if(initId === 'playground') renderPlayground();
else if(initId === 'arena') renderArena();
else if(initId.startsWith('arena-')) renderDrill(parseInt(initId.slice(6),10) || 0);
else if(ALL.find(x=>x.id===initId)) render(initId);
else render(ALL[0].id);
</script>
</body>
</html>
