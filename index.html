<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Git Workbench — Learn Git by Reading the Graph</title>
<meta name="description" content="An expert-built Git workbench with 143 command guides, a live commit graph, and 112 hands-on practice drills.">
<meta name="theme-color" content="#0a0d10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Git Workbench design system */
:root{
  color-scheme:dark;
  --font-primary:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono','SFMono-Regular',Consolas,monospace;
  --color-text-primary:#f0f3f6;
  --color-text-secondary:#aeb8c3;
  --color-text-tertiary:#77838f;
  --color-text-inverse:#15191d;
  --color-surface-base:#0a0d10;
  --color-surface-muted:#1d242c;
  --color-surface-raised:#12171d;
  --surface-2:#171d24;
  --surface-3:#1d242c;
  --accent:#f05133;
  --accent-hover:#ff684a;
  --accent-soft:rgba(240,81,51,.12);
  --accent-2:#2dd4bf;
  --accent-warn:#d9a21b;
  --accent-danger:#f85149;
  --accent-remote:#58a6ff;
  --border:#29323c;
  --border-strong:#3b4652;
  --space-1:4px;
  --space-2:8px;
  --space-3:12px;
  --space-4:16px;
  --space-5:20px;
  --space-6:24px;
  --space-7:28px;
  --space-8:32px;
  --space-10:40px;
  --space-12:48px;
  --space-16:64px;
  --space-20:80px;
  --radius-xs:3px;
  --radius-sm:4px;
  --radius-md:7px;
  --radius-lg:10px;
  --radius-xl:10px;
  --radius-2xl:12px;
  --radius-pill:999px;
  --shadow-1:0 16px 40px rgba(0,0,0,.22);
  --shadow-2:0 1px 0 rgba(255,255,255,.04) inset;
  --shadow-3:0 24px 60px rgba(0,0,0,.35);
  --shadow-4:none;
  --motion-instant:120ms;
  --motion-fast:150ms;
  --motion-normal:180ms;
  --motion-slow:240ms;
  --motion-slower:280ms;
  --motion-step6:320ms;
  --sidebar-width:292px;
  --topbar-height:58px;
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--topbar-height) + var(--space-4));}
body{
  margin:0;
  min-width:320px;
  background:var(--color-surface-base);
  color:var(--color-text-primary);
  font-family:var(--font-primary);
  font-size:16px;
  font-weight:400;
  line-height:1.625;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input{font:inherit;}
h1,h2,h3,h4{margin:0;color:var(--color-text-primary);font-weight:600;letter-spacing:-.025em;}
p{margin:0 0 1em;color:var(--color-text-secondary);}
code,.mono{font-family:var(--font-mono);}
a{color:var(--accent-hover);}
::selection{background:rgba(240,81,51,.8);color:#fff;}
:focus-visible{outline:2px solid var(--accent-hover);outline-offset:2px;border-radius:var(--radius-xs);}
:focus:not(:focus-visible){outline:none;}

.skip-link{
  position:fixed;left:var(--space-4);top:-100px;z-index:1000;
  background:var(--accent);color:#fff;padding:10px 14px;border-radius:var(--radius-md);
  font-weight:600;text-decoration:none;transition:top var(--motion-fast) ease;
}
.skip-link:focus{top:var(--space-4);}

/* Application shell */
.app{display:grid;grid-template-columns:var(--sidebar-width) minmax(0,1fr);min-height:100vh;}
.workspace{min-width:0;}
.workspace-bar{
  position:sticky;top:0;z-index:40;height:var(--topbar-height);
  display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);
  padding:0 clamp(var(--space-4),4vw,var(--space-8));
  background:rgba(10,13,16,.92);border-bottom:1px solid var(--border);
  backdrop-filter:blur(14px);
}
.repo-path{display:flex;align-items:center;min-width:0;gap:8px;font-size:14px;color:var(--color-text-tertiary);}
.repo-path strong{overflow:hidden;color:var(--color-text-primary);font-weight:600;text-overflow:ellipsis;white-space:nowrap;}
.repo-slash{color:var(--border-strong);}
.workspace-meta{display:flex;align-items:center;gap:10px;}
.branch-chip,.shortcut-hint{
  display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 10px;
  border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--color-surface-raised);
  color:var(--color-text-secondary);font-family:var(--font-mono);font-size:11px;
}
.branch-chip::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--accent-2);box-shadow:0 0 0 3px rgba(45,212,191,.12);}
.shortcut-hint{color:var(--color-text-tertiary);}
.sidebar-toggle{
  display:none;width:40px;height:40px;padding:0;border:1px solid var(--border);border-radius:var(--radius-md);
  background:var(--color-surface-raised);color:var(--color-text-primary);cursor:pointer;
}
.sidebar-toggle svg{width:19px;height:19px;display:block;margin:auto;}
.sidebar-backdrop{display:none;}

/* Navigation rail */
.sidebar{
  position:sticky;top:0;z-index:60;height:100vh;overflow-y:auto;overscroll-behavior:contain;
  padding:18px 14px var(--space-8);background:#0e1217;border-right:1px solid var(--border);
  scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent;
}
.sidebar::-webkit-scrollbar{width:7px;}
.sidebar::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:var(--radius-pill);}
.brand{display:flex;align-items:center;gap:12px;padding:0 6px 18px;margin-bottom:16px;border-bottom:1px solid var(--border);color:inherit;text-decoration:none;}
.brand-mark{
  display:grid;place-items:center;flex:0 0 auto;width:38px;height:38px;
  border-radius:var(--radius-md);background:var(--accent);color:#fff;box-shadow:0 8px 24px rgba(240,81,51,.18);
}
.brand-mark svg{width:21px;height:21px;}
.brand-text{min-width:0;font-size:15px;font-weight:600;line-height:1.2;letter-spacing:-.01em;}
.brand-text small{display:block;margin-top:4px;color:var(--color-text-tertiary);font-family:var(--font-mono);font-size:10px;font-weight:400;letter-spacing:0;white-space:nowrap;}
.search-wrap{margin:0 4px 12px;}
.search-label{display:block;margin-bottom:7px;color:var(--color-text-tertiary);font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;}
.search-shell{position:relative;display:flex;align-items:center;}
.search-shell svg{position:absolute;left:11px;width:15px;height:15px;color:var(--color-text-tertiary);pointer-events:none;}
.search-input{
  width:100%;height:40px;padding:0 38px 0 34px;border:1px solid var(--border);border-radius:var(--radius-md);
  background:var(--color-surface-raised);color:var(--color-text-primary);font-family:var(--font-primary);font-size:13px;
  transition:border-color var(--motion-fast) ease,background var(--motion-fast) ease,box-shadow var(--motion-fast) ease;
}
.search-input::placeholder{color:var(--color-text-tertiary);}
.search-input:hover{background:var(--surface-2);}
.search-input:focus-visible{border-color:var(--accent);background:var(--surface-2);box-shadow:0 0 0 3px var(--accent-soft);}
.search-key{position:absolute;right:9px;color:var(--color-text-tertiary);font-family:var(--font-mono);font-size:10px;pointer-events:none;}
.stats-row{display:flex;align-items:center;gap:8px;padding:0 5px 14px;color:var(--color-text-tertiary);font-family:var(--font-mono);font-size:10px;}
.stats-row b{color:var(--color-text-secondary);font-weight:600;}
.nav-groups{list-style:none;margin:0;padding:0;}
.tool-nav{list-style:none;margin:0 0 14px;padding:0 0 14px;border-bottom:1px solid var(--border);}
.nav-section-label{padding:0 8px 7px;color:var(--color-text-tertiary);font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;}
.nav-group{margin:0 0 3px;}
.nav-group summary{
  display:flex;align-items:center;min-height:40px;gap:9px;padding:6px 8px;border-radius:var(--radius-md);
  color:var(--color-text-secondary);cursor:pointer;font-size:13px;font-weight:500;list-style:none;
  transition:background var(--motion-fast) ease,color var(--motion-fast) ease;
}
.nav-group summary::-webkit-details-marker{display:none;}
.nav-group summary:hover{background:var(--color-surface-raised);color:var(--color-text-primary);}
.nav-group summary .chev{margin-left:auto;color:var(--color-text-tertiary);font-size:9px;transition:transform var(--motion-fast) ease;}
.nav-group[open] summary .chev{transform:rotate(90deg);}
.gicon{
  display:grid;place-items:center;flex:0 0 auto;width:28px;height:24px;border:1px solid var(--border);border-radius:var(--radius-sm);
  color:var(--color-text-tertiary);font-family:var(--font-mono);font-size:8px;font-weight:600;
}
.gcount{margin-left:auto;color:var(--color-text-tertiary);font-family:var(--font-mono);font-size:9px;}
.nav-group summary .gcount + .chev{margin-left:0;}
.nav-items{display:flex;flex-direction:column;gap:2px;list-style:none;margin:2px 0 8px;padding:0 0 0 37px;}
.nav-item{
  display:block;width:100%;min-height:34px;padding:7px 9px;border:0;border-radius:var(--radius-sm);
  background:transparent;color:var(--color-text-tertiary);cursor:pointer;text-align:left;
  font-family:var(--font-mono);font-size:11px;line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  transition:background var(--motion-instant) ease,color var(--motion-instant) ease,box-shadow var(--motion-instant) ease;
}
.nav-item:hover{background:var(--color-surface-raised);color:var(--color-text-secondary);}
.nav-item[aria-current="true"]{background:var(--accent-soft);color:#ff927d;font-weight:600;box-shadow:inset 2px 0 var(--accent);}
.tool-link{display:grid;grid-template-columns:32px minmax(0,1fr);align-items:center;gap:10px;min-height:50px;padding:7px 8px;font-family:var(--font-primary);}
.tool-link + .tool-link{margin-top:3px;}
.tool-icon{display:grid;place-items:center;width:30px;height:30px;border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--color-text-secondary);font-family:var(--font-mono);font-size:11px;}
.tool-copy{display:block;min-width:0;}
.tool-copy strong{display:block;color:inherit;font-size:13px;font-weight:600;}
.tool-copy small{display:block;margin-top:1px;color:var(--color-text-tertiary);font-size:10px;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* Main workbench */
.main{width:100%;max-width:1244px;margin:0 auto;padding:clamp(28px,4vw,48px) clamp(18px,4vw,48px) var(--space-20);}
#content > :first-child{animation:viewEnter var(--motion-normal) ease-out both;}
@keyframes viewEnter{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.command-header{margin-bottom:24px;}
.crumb{display:flex;align-items:center;gap:7px;margin-bottom:10px;color:var(--color-text-tertiary);font-family:var(--font-mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;}
.crumb .sep{color:var(--border-strong);}
.crumb .cur{color:var(--accent-2);}
.crumb button{padding:0;border:0;background:none;color:inherit;cursor:pointer;font:inherit;text-transform:inherit;}
.cmd-title{max-width:980px;margin:0;color:var(--color-text-primary);font-family:var(--font-mono);font-size:clamp(25px,4vw,36px);font-weight:600;line-height:1.25;letter-spacing:-.035em;overflow-wrap:anywhere;}
.command-overview{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.65fr);align-items:start;gap:16px;margin-bottom:24px;}
.cat-context,.scenario-card{margin:0;padding:18px 20px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--color-surface-raised);}
.scenario-card{border-left:3px solid var(--accent);background:var(--surface-2);}
.cat-context .eyebrow,.scenario-card .label{margin-bottom:8px;color:var(--color-text-tertiary);font-size:10px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;}
.scenario-card .label{color:#ff927d;}
.cat-context p,.scenario-card p{margin:0;color:var(--color-text-secondary);font-size:14px;line-height:1.65;}
.scenario-card p{color:var(--color-text-primary);font-size:15px;}
.cat-context .analogy-line{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);color:var(--color-text-tertiary);font-size:12px;line-height:1.6;}
.panel{overflow:hidden;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--color-surface-raised);box-shadow:var(--shadow-2);}
.graph-panel{margin-bottom:24px;}
.panel-head{display:flex;align-items:center;justify-content:space-between;min-height:43px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface-2);color:var(--color-text-tertiary);font-family:var(--font-mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;}
.panel-head span:last-child{color:var(--color-text-secondary);}
.icon-stage{
  display:flex;align-items:center;justify-content:center;min-height:250px;padding:20px;cursor:default;
  background-color:#0d1116;background-image:radial-gradient(rgba(119,131,143,.16) .7px,transparent .7px);background-size:18px 18px;
}
.icon-stage:hover svg *{animation-play-state:paused!important;}
.icon-stage svg text{font-family:var(--font-mono);}
.graph-caption{min-height:28px;padding:0 20px 12px;color:var(--color-text-secondary);font-size:13px;text-align:center;}
.panel-controls{justify-content:center;padding:0 16px 16px;}
.stage-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-bottom:24px;}
.terminal-body{min-height:210px;padding:18px 20px;background:#0d1116;color:var(--color-text-secondary);font-family:var(--font-mono);font-size:13px;line-height:1.65;overflow:auto;}
.terminal-body .prompt{color:var(--color-text-tertiary);}
.terminal-body .typed{color:var(--accent-2);}
.terminal-body .tcursor{display:inline-block;width:.48em;height:1em;background:var(--accent-2);vertical-align:-.14em;animation:blink .9s steps(1) infinite;}
.terminal-body .out{display:inline;color:var(--color-text-tertiary);white-space:pre-wrap;}
@keyframes blink{50%{opacity:0;}}
.practice-panel{margin-bottom:24px;border-color:rgba(45,212,191,.36);}
.practice-panel .panel-head{box-shadow:inset 3px 0 var(--accent-2);}
.practice-task{padding:18px 20px 0;color:var(--color-text-primary);font-size:15px;}
.result-message{min-height:30px;padding:0 20px 12px;color:var(--color-text-secondary);font-size:13px;text-align:center;}
.command-bar{display:flex;align-items:center;gap:10px;padding:0 16px 12px;}
.command-prompt{flex:0 0 auto;color:var(--accent-2);font-family:var(--font-mono);font-size:14px;}
.command-input{flex:1;min-width:0;font-family:var(--font-mono);}
.practice-actions{padding:0 16px 16px;}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.btn{
  min-height:40px;padding:9px 13px;border:1px solid var(--border);border-radius:var(--radius-md);
  background:var(--surface-2);color:var(--color-text-primary);cursor:pointer;font-family:var(--font-mono);font-size:11px;font-weight:600;
  transition:border-color var(--motion-fast) ease,background var(--motion-fast) ease,color var(--motion-fast) ease,transform var(--motion-fast) ease,box-shadow var(--motion-fast) ease;
}
.btn:hover{border-color:var(--border-strong);background:var(--surface-3);transform:translateY(-1px);}
.btn:active{transform:none;}
.btn:disabled{opacity:.38;cursor:not-allowed;transform:none;}
.btn.primary{border-color:var(--accent);background:var(--accent);color:#fff;}
.btn.primary:hover{border-color:var(--accent-hover);background:var(--accent-hover);box-shadow:0 7px 20px rgba(240,81,51,.2);}
.pager{justify-content:space-between;margin:0 0 32px;}
.related-title{margin:0 0 10px;color:var(--color-text-tertiary);font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;}
.related-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;list-style:none;margin:0 0 32px;padding:0;}
.related-list > li{min-width:0;}
.related-item{
  display:block;width:100%;min-height:68px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius-md);
  background:var(--color-surface-raised);color:inherit;cursor:pointer;text-align:left;
  transition:border-color var(--motion-fast) ease,background var(--motion-fast) ease,transform var(--motion-fast) ease;
}
.related-item:hover{border-color:var(--border-strong);background:var(--surface-2);transform:translateX(2px);}
.related-item code{display:block;margin-bottom:3px;color:var(--accent-2);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.related-item span{display:block;color:var(--color-text-tertiary);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* Arena and Playground */
.arena-progress{margin-bottom:24px;padding:20px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--color-surface-raised);}
.progress-meta{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:12px;}
.progress-copy strong{display:block;color:var(--color-text-primary);font-size:20px;font-weight:600;}
.progress-copy span{color:var(--color-text-tertiary);font-size:12px;}
.progress-percent{color:var(--accent-2);font-family:var(--font-mono);font-size:14px;}
.progress-track{width:100%;height:7px;border:0;border-radius:var(--radius-pill);background:var(--surface-3);overflow:hidden;appearance:none;}
.progress-track::-webkit-progress-bar{background:var(--surface-3);}
.progress-track::-webkit-progress-value{background:var(--accent-2);border-radius:var(--radius-pill);}
.progress-track::-moz-progress-bar{background:var(--accent-2);border-radius:var(--radius-pill);}
.arena-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;}
.arena-toolbar p{max-width:720px;margin:0;color:var(--color-text-secondary);font-size:13px;}
.level-tabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--border);}
.level-tab{position:relative;min-height:42px;padding:0 13px;border:0;background:transparent;color:var(--color-text-tertiary);cursor:pointer;font-size:13px;font-weight:500;}
.level-tab[aria-selected="true"]{color:var(--color-text-primary);}
.level-tab[aria-selected="true"]::after{content:'';position:absolute;right:0;bottom:-1px;left:0;height:2px;background:var(--accent);}
.arena-level[hidden]{display:none;}
.level-heading{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:18px 0 10px;}
.level-heading h2{font-size:18px;}
.level-heading span{color:var(--color-text-tertiary);font-family:var(--font-mono);font-size:10px;}
.drill-list{display:flex;flex-direction:column;gap:6px;list-style:none;margin:0 0 32px;padding:0;}
.drill-row{
  display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:13px;width:100%;min-height:66px;
  padding:10px 13px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--color-surface-raised);color:inherit;cursor:pointer;text-align:left;
  transition:border-color var(--motion-fast) ease,background var(--motion-fast) ease,transform var(--motion-fast) ease;
}
.drill-row:hover{border-color:var(--border-strong);background:var(--surface-2);transform:translateX(2px);}
.drill-row.is-done{border-color:rgba(45,212,191,.3);}
.drill-number{display:grid;place-items:center;width:36px;height:36px;border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--color-text-tertiary);font-family:var(--font-mono);font-size:10px;}
.drill-row.is-done .drill-number{border-color:rgba(45,212,191,.35);background:rgba(45,212,191,.08);color:var(--accent-2);}
.drill-copy strong{display:block;color:var(--color-text-primary);font-size:13px;font-weight:500;}
.drill-copy span{display:block;margin-top:2px;color:var(--color-text-tertiary);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.drill-status{color:var(--color-text-tertiary);font-family:var(--font-mono);font-size:9px;text-transform:uppercase;}
.drill-row.is-done .drill-status{color:var(--accent-2);}
.playground-layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(260px,.55fr);gap:16px;margin-bottom:24px;}
.playground-layout .graph-panel{margin:0;}
.playground-aside{display:flex;flex-direction:column;gap:16px;}
.playground-aside .cat-context{height:100%;}
.playground-examples{display:flex;flex-direction:column;margin:0;padding:12px;}
.playground-examples .btn{width:100%;text-align:left;}
.empty-state{padding:64px 20px;color:var(--color-text-tertiary);text-align:center;}
.empty-state h2{margin-bottom:8px;color:var(--color-text-secondary);}

/* Existing scene motion */

/* ---------------- Motion keyframes (reused per-category) ---------------- */
@keyframes popIn{ 0%{transform:scale(0.3) rotate(-6deg); opacity:0;} 60%{transform:scale(1.15) rotate(2deg);} 100%{transform:scale(1) rotate(0); opacity:1;} }
@keyframes pulseGlow{ 0%,100%{filter:drop-shadow(0 0 2px currentColor);} 50%{filter:drop-shadow(0 0 14px currentColor);} }
@keyframes dashFlow{ to{ stroke-dashoffset:-40; } }
@keyframes gearSpin{ to{ transform:rotate(360deg); } }
@keyframes flyAcross{ 0%{transform:translateX(-70px); opacity:0;} 20%{opacity:1;} 80%{opacity:1;} 100%{transform:translateX(70px); opacity:0;} }
@keyframes sweepOff{ 0%{transform:translateX(0); opacity:1;} 100%{transform:translateX(80px); opacity:0;} }
@keyframes slideIn{ 0%{transform:translateX(-46px); opacity:0;} 100%{transform:translateX(0); opacity:1;} }
@keyframes hunkFade{ 0%{opacity:0;} 100%{opacity:1;} }
@keyframes cloudPulse{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.12);} }
@keyframes hexFlicker{ 0%,100%{opacity:1;} 50%{opacity:0.3;} }
@keyframes reorderHop{ 0%{transform:translateY(0);} 50%{transform:translateY(-18px);} 100%{transform:translateY(0);} }
@keyframes ringBurst{ 0%{r:4; stroke-width:6; stroke-opacity:0.9;} 100%{r:36; stroke-width:0.5; stroke-opacity:0;} }
@keyframes shakeX{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-4px);} 75%{transform:translateX(4px);} }
@keyframes pillHop{ 0%{transform:translateY(0) scale(1);} 35%{transform:translateY(-9px) scale(1.12);} 70%{transform:translateY(2px) scale(0.97);} 100%{transform:translateY(0) scale(1);} }
@keyframes confettiFall{
  0%{ transform:translateY(-10px) rotate(0deg); opacity:1; }
  100%{ transform:translateY(240px) rotate(var(--spin,540deg)) translateX(var(--drift,0px)); opacity:0; }
}
.confetti-bit{
  position:absolute; top:0; width:8px; height:8px; border-radius:2px; pointer-events:none;
  animation:confettiFall var(--dur,1.4s) cubic-bezier(.2,.6,.6,1) forwards;
}

@media (max-width:1100px){
  :root{--sidebar-width:248px;}
  .command-overview,.playground-layout{grid-template-columns:1fr;}
  .playground-examples{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));}
}
@media (max-width:840px){
  :root{--topbar-height:54px;}
  .app{display:block;}
  .sidebar{
    position:fixed;inset:0 auto 0 0;width:min(88vw,310px);height:100svh;box-shadow:var(--shadow-3);
    transform:translateX(-105%);visibility:hidden;transition:none;
  }
  .sidebar.is-animating{transition:transform var(--motion-normal) ease,visibility var(--motion-normal) step-end;}
  .sidebar[data-open="true"]{transform:translateX(0);visibility:visible;}
  .sidebar[data-open="true"].is-animating{transition:transform var(--motion-normal) ease,visibility 0s;}
  .sidebar-backdrop{position:fixed;inset:0;z-index:50;display:block;border:0;background:rgba(0,0,0,.58);opacity:0;pointer-events:none;transition:none;}
  .sidebar-backdrop.is-animating{transition:opacity var(--motion-normal) ease;}
  .sidebar-backdrop[data-open="true"]{opacity:1;pointer-events:auto;}
  .sidebar-toggle{display:block;flex:0 0 auto;}
  .nav-item,.nav-group summary{min-height:44px;}
  .workspace-bar{padding:0 12px;}
  .repo-path{margin-right:auto;}
  .shortcut-hint{display:none;}
  .main{padding:24px 16px 64px;}
  .stage-grid{grid-template-columns:1fr;}
  .workspace-meta{gap:6px;}
  body.nav-open{overflow:hidden;}
}
@media (max-width:560px){
  .branch-chip{display:none;}
  .cmd-title{font-size:24px;line-height:1.35;}
  .command-overview{gap:10px;margin-bottom:16px;}
  .cat-context,.scenario-card{padding:15px 16px;}
  .icon-stage{min-height:220px;padding:12px 8px;}
  .stage-grid{gap:10px;margin-bottom:16px;}
  .command-bar{align-items:stretch;flex-wrap:wrap;}
  .command-prompt{align-self:center;}
  .command-bar .btn.primary{margin-left:25px;flex:1 0 calc(100% - 25px);}
  .btn{min-height:44px;}
  .pager{display:grid;grid-template-columns:1fr 1fr;}
  .related-list{grid-template-columns:1fr;}
  .playground-examples{grid-template-columns:1fr;}
  .drill-row{grid-template-columns:38px minmax(0,1fr);}
  .drill-status{display:none;}
  .arena-toolbar{align-items:stretch;flex-direction:column;}
  .level-tabs{overflow-x:auto;}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto;}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important;}
  .terminal-body .tcursor{display:none;}
}

<script>
const CATEGORIES = [{"icon":"🚪","name":"Meet the Machine","num":"00","desc":"Before typing a single command, understand git's <b>3-room house</b>: your <b>Working Directory</b> (the desk you're editing on), the <b>Staging Area</b> (a tray where you place things you're about to photograph), and the <b>Repository</b> (the photo album where snapshots live forever).","analogy":"Think of git like a camera with a prep tray. You don't photograph your whole messy desk — you pick items, put them on a tray (stage), then press the shutter (commit) to save a permanent photo.","items":[["git config --global user.name \"...\"","Stamps your name on every photo you take, so the album knows whose work it is."],["git config --global user.email \"...\"","Same idea — your email becomes part of every commit signature."],["git config --list","Scenario: you forgot which name/email you set on this machine — check before your first commit."],["git --version","Scenario: setting up a new machine — confirms git actually installed and which version."],["git config --global init.defaultBranch main","Scenario: tired of new repos defaulting to \"master\" — sets your preferred default branch name once, globally."]]},{"icon":"🍳","name":"Save Points","num":"01","desc":"This is the core loop you'll repeat thousands of times: <b>edit → stage → commit</b>. Every commit is a save point you can always return to.","analogy":"Like a video game's save system. You play (edit files), walk to a checkpoint and load your inventory into it (stage), then hit 'Save Game' (commit). Each save is permanent and named.","items":[["git init","Scenario: starting a brand new project folder — turns an ordinary folder into a git-tracked one."],["git status","Scenario: you forget what you changed — shows what's edited, staged, or untouched right now."],["git add <file>","Scenario: you fixed one bug in a 5-file change — stage only that file, leave the rest for later."],["git commit -m \"msg\"","Scenario: staged changes are ready — permanently saves them with a message explaining why."],["git log --oneline","Scenario: reviewing project history fast — one line per save point."],["git diff / --staged","Scenario: \"what exactly did I change?\" — diff shows unstaged edits, --staged shows what's about to be committed."],[".gitignore","Scenario: build folders / secrets keep showing up in git status — lists patterns git should never track."],["git show <commit>","Scenario: want the exact snapshot + diff of one specific save point — shows it in full."]]},{"icon":"🕰️","name":"The Time Machine","num":"02","desc":"Mistakes happen. Git gives you three very different undo buttons — each rewrites a different amount of history.","analogy":"Amend = 'retake the last photo before anyone saw it.' Reset = 'rip pages out of the album.' Revert = 'add a new photo that visibly cancels the old one, keeping the record honest.'","items":[["git commit --amend","Scenario: typo in your last commit message, or forgot one file — fixes the most recent save point in place."],["git reset --soft HEAD~1","Scenario: last commit was too early — uncommits it but keeps changes staged."],["git reset --hard HEAD~1","Scenario: last commit was garbage, nuke it entirely — DANGER: deletes the work too."],["git revert <commit>","Scenario: bad commit already pushed and others pulled it — adds a new commit that undoes it, history stays intact."],["git restore <file>","Scenario: you messed up a file, want your last saved version back."],["git restore --staged <file>","Scenario: you staged the wrong file by mistake — takes it off the tray, keeps your edits."],["git reset --mixed HEAD~1","Scenario: default reset mode — uncommits AND unstages, but keeps your edits on disk."]]},{"icon":"🪞","name":"Parallel Timelines","num":"03","desc":"A branch is a separate timeline you can experiment in without touching the main story. Merging is how two timelines rejoin into one.","analogy":"Like a choose-your-own-adventure book: you photocopy the current page (branch), scribble a wild idea on the copy, and if it works out you glue it back into the main book (merge). If two pages changed the same sentence — that's a conflict, and you decide the final wording by hand.","items":[["git branch <name>","Scenario: about to try a risky idea — create a parallel timeline without touching main."],["git switch -c <name>","Scenario: same as above but jump into it immediately — create + switch in one move."],["git merge <branch>","Scenario: your feature branch works — fold its timeline back into main."],["(conflict) edit → git add → git commit","Scenario: two branches touched the same line — git can't auto-decide, you pick the final version by hand."],["git branch -d <name>","Scenario: feature merged and done — delete the now-redundant branch."],["git branch -D <name>","Scenario: branch has UNMERGED work you're sure you don't need — force-deletes it anyway."],["git switch <branch> / checkout <branch>","Scenario: hopping between existing timelines — moves your working directory to that branch's snapshot."],["git merge <branch> (fast-forward)","Scenario: main hasn't moved since you branched — git just slides the main pointer forward, no merge commit needed."]]},{"icon":"☁️","name":"Talking to the Cloud","num":"04","desc":"Your repository can have a twin living on a server (GitHub etc). Push sends your photos up; pull brings new photos down.","analogy":"Think of it like a shared Dropbox album. 'Push' uploads your new photos for everyone. 'Fetch' peeks at what others added without touching your album. 'Pull' actually merges those new photos into yours.","items":[["git remote add origin <url>","Scenario: local project exists, no cloud copy yet — links it to a GitHub repo address."],["git push -u origin main","Scenario: first upload — sends commits up and remembers this pairing for future pushes."],["git fetch","Scenario: \"did my teammate push anything?\" — downloads new history WITHOUT merging it into your files yet."],["git pull","Scenario: you want teammates' changes merged into your working copy right now — fetch + merge combined."],["git clone <url>","Scenario: joining a project for the first time — downloads the entire repo + history to a new machine."],["git remote -v","Scenario: \"which cloud is this actually linked to?\" — lists remote names and their URLs."],["tracking branches","Scenario: after first push -u, plain \"git push\"/\"git pull\" know where to sync — the local and remote branch are linked automatically."]]},{"icon":"✉️","name":"Pull Requests","num":"05","desc":"Teams rarely push straight to main. Instead: branch → push → open a Pull Request → get reviewed → merge.","analogy":"Like submitting a school essay draft for peer review before it goes in the final anthology. Your branch is the draft; the PR is the review thread; merging is publishing it into the anthology (main).","items":[["git push -u origin feature/x","Scenario: your branch is ready for eyes on it — pushes it to the cloud so a PR can be opened against it."],["Open Pull Request (GitHub UI)","Scenario: code's ready for review — proposes merging feature/x into main, teammates comment inline."],["git log --graph --oneline --all","Scenario: confused how branches relate — draws the whole tree of timelines in your terminal."],["Merge PR (squash / merge / rebase)","Scenario: review approved — folds the reviewed branch into main, closing the loop."],["Fork vs Clone","Scenario: contributing to a repo you don't own — fork makes your own cloud copy first, THEN you clone your fork locally."],["git rm --cached <file>","Scenario: a file got committed before you added it to .gitignore — untracks it from git without deleting it from disk."]]},{"icon":"🪜","name":"Rebase & Cherry-pick","num":"06","desc":"Rebase replays your commits on top of a new base — like editing the story so it reads as if it happened later, in order.","analogy":"Merge says 'these two timelines collided, here's a knot tying them together.' Rebase says 'pretend your changes happened AFTER everyone else's, so the story reads as one straight line.' Never rebase a timeline other people are already reading from (a shared/public branch) — you'd yank pages out from under them.","items":[["git rebase main","Scenario: main moved on while you worked — replay your branch's commits on top of the latest main for a clean, linear history."],["git rebase -i HEAD~4","Scenario: 4 messy \"wip\" commits before a PR — interactively squash/reword/reorder them into one clean commit."],["git cherry-pick <commit>","Scenario: one specific fix on another branch is needed here NOW, not the whole branch — grabs just that one commit."],["git reflog","Scenario: \"I think I just destroyed my work\" — a safety log of every place HEAD has ever pointed, your undo-undo button."],["git rebase --continue / --abort","Scenario: mid-rebase you hit a conflict — fix it and --continue, or bail entirely with --abort to return to how you started."]]},{"icon":"🔍","name":"Inspection & Debugging","num":"07","desc":"When something broke and you don't know when or who — git has a metal detector and a stash pocket.","analogy":"git bisect is playing 'hot or cold' with your commit history: git picks a midpoint, you say good/bad, it halves the search space each time until the guilty commit is caught. git stash is shoving your messy desk into a drawer so you can deal with something urgent, then pulling the drawer back out later.","items":[["git bisect start / good / bad","Scenario: a bug appeared sometime in the last 50 commits, unclear which — binary-searches to pinpoint the exact culprit."],["git blame <file>","Scenario: \"who wrote this weird line and why?\" — shows the commit + author responsible for each line."],["git stash","Scenario: mid-edit, urgent hotfix needed — shelves your unfinished changes so your working directory is clean."],["git stash pop","Scenario: hotfix done — brings your shelved changes back out."],["git log -S\"text\"","Scenario: \"which commit introduced/removed this exact string?\" — searches history by code content, not message."],["git log --author / --since / -p","Scenario: \"what did Priya change last week?\" — filters history by person, date range, or shows full patches inline."],["git stash list / apply / drop","Scenario: several shelved changes piled up — list sees them all, apply reuses one without removing it, drop discards one."],["git tag / annotated vs lightweight","Scenario: shipping v1.2.0 — tag marks that exact commit permanently; annotated tags also store author, date, and a message (use these for releases)."]]},{"icon":"🧱","name":"What Git Actually Is","num":"08","desc":"Under the hood, git is just a content-addressed graph of objects: blobs (file contents), trees (folders), commits (snapshots + parent links).","analogy":"Every version of every file gets a fingerprint (hash). A commit isn't a diff — it's a full snapshot that mostly points at the same unchanged fingerprints as before, only the changed ones are new. That's why git is fast: unchanged files cost almost nothing to 'save' again.","items":[["git cat-file -p <hash>","Scenario: curiosity / debugging deep issue — prints the raw content of any git object by its hash."],["git gc","Scenario: repo folder ballooning in size — compresses loose objects into efficient packfiles."],["git fsck","Scenario: suspect repo corruption — verifies the integrity of the whole object database."],[".git/ directory","Scenario: curious what git actually stores — objects/ (the album), refs/ (branch pointers), HEAD (your current position), all live here."],["detached HEAD","Scenario: you checked out a commit hash directly, not a branch — you're \"detached,\" new commits here can get lost unless you branch from them."]]},{"icon":"🚗","name":"Multi-repo & Large Projects","num":"09","desc":"Some projects are too big or too composed-of-other-projects for one flat repo.","analogy":"A submodule is a repo-inside-a-repo — like embedding a photo album inside another album, but it's really just a linked reference, not a copy. A worktree is having two doors into the same house, each door open to a different room (branch), simultaneously.","items":[["git submodule add <url>","Scenario: your project depends on another whole git repo (e.g. a shared component lib) — embeds it as a linked reference."],["git worktree add ../hotfix main","Scenario: mid-feature, urgent hotfix needed on main, don't want to stash — opens a second working folder on a different branch simultaneously."],["git sparse-checkout","Scenario: monorepo is huge, you only work in one folder — checks out just the slice you need."],["git subtree","Scenario: want another repo's code merged directly into yours (no separate linked repo to manage) — an alternative to submodules that copies the code in."],["Git LFS","Scenario: repo needs to track huge binary files (videos, PSDs) — stores pointers in git, actual bytes in a separate large-file store."]]},{"icon":"🛡️","name":"Workflow Mastery","num":"10","desc":"The final layer isn't new commands — it's discipline: conventions, automation, and safety nets that make git invisible in daily work.","analogy":"A pre-commit hook is a bouncer at the door of your repository, checking IDs before anything gets in. Conventional commits are a shared shorthand ('fix:', 'feat:') so history reads like a changelog, not a diary.","items":[["git commit -S -m \"...\"","Scenario: proving commits really came from you — cryptographically signs the commit."],["pre-commit hook","Scenario: block commits containing secrets or forbidden keywords, automatically, before they ever save."],["git config --global alias.co switch","Scenario: typing \"git switch\" 40x/day is tedious — aliases compress it to \"git co\"."],["git filter-repo","Scenario: a secret key got committed 200 commits ago — rewrites entire history to scrub it out (use with extreme care)."],["Git Flow / GitHub Flow / Trunk-Based","Scenario: choosing how your team branches — GitHub Flow (simple: branch + PR + merge), Git Flow (structured: develop/release/hotfix branches), Trunk-Based (everyone commits to main constantly, behind feature flags)."],["Conventional Commits (feat:, fix:, ...)","Scenario: want auto-generated changelogs — prefixing commit messages by type makes history machine-readable."]]},{"icon":"🗄️","name":"The Long Tail","num":"11","desc":"The rare commands: not daily-driver, but exactly what you reach for once a year and forget the syntax of every time.","analogy":"If phases 0-10 were the rooms of the house, this is the junk drawer — patch files instead of live syncing (like mailing a photocopy instead of sharing the album), bundles as a repo-in-a-single-file you can hand someone on a USB stick, and rerere as git remembering how you solved a fight last time so it doesn't ask twice.","items":[["git log --graph --pretty=format:\"...\"","Scenario: want a custom-formatted, colorized commit graph in scripts or aliases — full control over what each line shows."],["git diff --word-diff","Scenario: one word changed in a paragraph — highlights the exact word instead of the whole line."],["git rerere","Scenario: rebasing repeatedly hits the SAME conflict — git remembers your last resolution and reapplies it automatically."],["git notes","Scenario: want to attach a comment (\"reviewed by QA\") to a commit without rewriting it — notes live alongside, not inside, the commit."],["git archive","Scenario: need to hand someone the CODE only, no .git history — exports a clean zip/tar snapshot."],["git bundle","Scenario: no network access, need to transfer commits — packages the repo (or a range) into one portable file."],["git push --force-with-lease","Scenario: must force-push after a rebase, but don't want to clobber a teammate's new commits — refuses if the remote moved since you last fetched."],[".gitattributes","Scenario: Windows/Mac line-ending chaos in a shared repo — declares how git should normalize text files, binaries, and diffs per file type."],["git shortlog / describe","Scenario: writing release notes — shortlog summarizes commits per author, describe names the current commit relative to the nearest tag (e.g. v1.2.0-3-gabc1234)."],["git format-patch / git am","Scenario: contributing without a shared remote (email-based workflows, some kernel-style projects) — format-patch exports commits as .patch files, am applies them on the other end."],["git worktree list / remove / prune","Scenario: cleaning up after Phase 9's worktree add — list shows all active worktrees, remove/prune clear out the ones you're done with."],["git maintenance / repack","Scenario: a years-old repo feels sluggish — runs housekeeping (repacking objects, pruning) to keep it fast."]]},{"icon":"📁","name":"File & Working Tree","num":"12.1","desc":"Reference-tier commands for file & working tree — not daily-driver, but essential when the moment calls for them.","analogy":"","items":[["git mv <old> <new>","Scenario: renaming a file — moves it AND stages the rename in one step, so git tracks it as a rename not a delete+add."],["git rm <file>","Scenario: file should be deleted from both disk and git — removes and stages the deletion together."],["git clean -fd","Scenario: build artifacts and stray untracked files cluttering your working dir — force-deletes anything git doesn't track (dirs too)."],["git grep \"pattern\"","Scenario: searching code across the whole tracked tree fast, without leaving git's index."],["git ls-files","Scenario: \"what does git actually think is tracked here?\" — lists every tracked file."],["git check-ignore -v <file>","Scenario: a file refuses to be added — shows exactly which .gitignore rule is blocking it."],[".git/info/exclude","Scenario: want to ignore a file locally without touching the shared .gitignore — a private, per-clone ignore list."]]},{"icon":"🪄","name":"History Rewriting Extras","num":"12.2","desc":"Reference-tier commands for history rewriting extras — not daily-driver, but essential when the moment calls for them.","analogy":"","items":[["git commit --fixup <sha>","Scenario: small correction to an old commit before a PR — marks it for auto-squashing later."],["git rebase -i --autosquash","Scenario: several --fixup commits queued up — automatically folds each into its target during interactive rebase."],["git rebase --onto <newbase> <upstream> <branch>","Scenario: branch was built on the wrong base — surgically re-parents just the commits you want onto a different base."],["git commit --amend --no-edit","Scenario: forgot one file in the last commit, message is still fine — adds it without opening the editor."],["git commit --allow-empty","Scenario: need a commit with no file changes (e.g. to trigger CI) — creates one anyway."],["git filter-branch (legacy)","Scenario: old scripts still reference this — historically used to rewrite history in bulk; git filter-repo (Phase 10) replaces it, filter-branch is now discouraged."]]},{"icon":"🎯","name":"Staging & Diff Power Moves","num":"12.3","desc":"Reference-tier commands for staging & diff power moves — not daily-driver, but essential when the moment calls for them.","analogy":"","items":[["git add -p","Scenario: one file has 3 unrelated changes — interactively stage only some hunks, split the rest into a later commit."],["git add -A vs . vs -u","Scenario: unsure what \"stage everything\" actually stages — -A stages all changes repo-wide, . stages from current dir down, -u stages only already-tracked files."],["git stash -p","Scenario: only part of your working changes should be shelved — interactively pick which hunks go into the stash."],["git stash show -p","Scenario: \"what's actually inside that stash?\" — previews its diff without applying it."],["git stash branch <name>","Scenario: stashed work has since conflicted with main — creates a fresh branch from the stash point and replays it there cleanly."],["git diff --stat","Scenario: quick \"how big was this change?\" — file-by-file summary of insertions/deletions, no line detail."],["git log --stat","Scenario: reviewing history — shows which files each commit touched and by how much."],["git log --follow <file>","Scenario: tracing a file's history through a rename — keeps following it past the rename point."],["git log --grep=\"text\"","Scenario: \"which commit message mentioned the payment bug?\" — searches commit messages, not code."],["git log -- <path>","Scenario: history of ONE file or folder only, ignoring every other change in the repo."]]},{"icon":"🌐","name":"Branch & Remote Management","num":"12.4","desc":"Reference-tier commands for branch & remote management — not daily-driver, but essential when the moment calls for them.","analogy":"","items":[["git branch -m <old> <new>","Scenario: branch name has a typo — renames it in place."],["git branch --contains <sha>","Scenario: \"which branches have this fix?\" — lists every branch that includes a given commit."],["git branch -r / -a","Scenario: want to see remote-tracking branches too, not just local ones — -r shows remote, -a shows all."],["git remote rename/remove/set-url","Scenario: repo moved to a new host, or origin was misnamed — updates the remote's name or URL without re-cloning."],["git remote prune origin","Scenario: teammates deleted their branches on GitHub but your local remote-tracking refs still list them — cleans up the stale ones."],["git fetch --prune","Scenario: same cleanup, done automatically as part of every fetch."],["git pull --rebase","Scenario: want to sync with origin WITHOUT creating a merge bubble — replays your local commits on top instead of merging."],["git push --delete origin <branch>","Scenario: feature branch merged, want it gone from GitHub too — deletes the remote branch directly."],["git push --tags","Scenario: tags don't push automatically with commits — explicitly sends all local tags to the remote."],["git tag -d <name>","Scenario: tagged the wrong commit — deletes the local tag so you can redo it."],["git merge --no-ff","Scenario: opes blame to a line range instead of the whole file."]]},{"icon":"⚙️","name":"Config & Environment","num":"12.6","desc":"Reference-tier commands for config & environment — not daily-driver, but essential when the moment calls for them.","analogy":"","items":[["git config --local/--global/--system","Scenario: setting differ per-repo vs per-user vs machine-wide — three layers, local overrides global overrides system."],["core.editor / $GIT_EDITOR","Scenario: commit messages keep opening in the wrong editor — sets which one git launches for messages/rebases."],["GIT_AUTHOR_NAME / GIT_AUTHOR_EMAIL","Scenario: scripting commits with a specific identity (e.g. a bot) — env vars override config for that one command."],["git config --edit","Scenario: config file has many entries to tweak at once — opens it directly in your editor instead of one command per setting."],["credential.helper","Scenario: typing your GitHub password on every push — caches or stores credentials so git stops asking."]]},{"icon":"📮","name":"Collaboration Extras","num":"12.7","desc":"Reference-tier commands for collaboration extras — not daily-driver, but essential when the moment calls for them.","analogy":"","items":[["git request-pull","Scenario: no PR platform available — generates a summary text you can email describing what to pull and from where."],["git format-patch --stdout \\| git send-email","Scenario: fully email-based contribution workflow (e.g. Linux kernel style) — mails patches directly instead of pushing anywhere."],["git range-diff v1..v2 v1'..v2'","Scenario: \"how did my rebased branch's commits change vs before the rebase?\" — diffs two versions of a commit range against each other."],["git difftool / git mergetool","Scenario: terminal diffs too cramped to read — launches your configured GUI diff/merge tool instead."],["git instaweb","Scenario: want a quick local web UI to browse repo history — spins one up instantly, no server setup."]]},{"icon":"🧹","name":"Maintenance Extras","num":"12.8","desc":"Reference-tier commands for maintenance extras — not daily-driver, but essential when the moment calls for them.","analogy":"","items":[["git reflog expire --expire=now --all","Scenario: about to run gc and want the reflog safety net cleared first (rare, deliberate) — expires reflog entries early."],["git fsck --full","Scenario: deep corruption suspected — the thorough version of fsck, checks unreachable objects too."],["git gc --aggressive","Scenario: repo is old and huge, one-time deep optimization — repacks more thoroughly than default gc (slow, run rarely)."],["git prune","Scenario: loose unreachable objects taking up space after a hard reset/rebase — deletes objects nothing points to anymore."]]}];

/* ============================================================
   COMMIT-GRAPH SCENE ENGINE (learngitbranching-style)
   Each command maps to a scene: 3 steps of {nodes, edges, refs, note}.
   Nodes: {id, x, lane, color, hash, ghost, glow, cross}
   Lanes: 0=remote (dashed area), 1=feature, 2=main, 3=stash/extra
   ============================================================ */
const GC = { main:'#f05133', feat:'#2dd4bf', remote:'#58a6ff', warn:'#d9a21b', danger:'#f85149', ghost:'rgba(174,184,195,0.24)', ink:'#77838f' };
const LANE_Y = { 0:46, 1:96, 2:146, 3:196 };

function N(id, x, lane, color, opts={}){ return Object.assign({id, x, lane, color, hash:id}, opts); }

const SVGNS = 'http://www.w3.org/2000/svg';

function confettiBurst(hostEl){
  hostEl.style.position = 'relative'; hostEl.style.overflow = 'hidden';
  const colors = ['#f05133','#2dd4bf','#58a6ff','#d9a21b','#f0f3f6'];
  for(let i=0;i<28;i++){
    const b = document.createElement('div');
    b.className = 'confetti-bit';
    b.style.left = (4 + Math.random()*92) + '%';
    b.style.background = colors[i % colors.length];
    b.style.setProperty('--dur', (1 + Math.random()*0.9) + 's');
    b.style.setProperty('--spin', (360 + Math.random()*720) + 'deg');
    b.style.setProperty('--drift', ((Math.random()-0.5)*90) + 'px');
    b.style.animationDelay = (Math.random()*0.18) + 's';
    hostEl.appendChild(b);
    setTimeout(()=>b.remove(), 2400);
  }
}
function drawGraph(container, step){
  const W=620, H=232;
  const nodes = step.nodes||[], edges = step.edges||[], refs = step.refs||[];
  const nodeById = Object.fromEntries(nodes.map(n=>[n.id,n]));
  const maxX = Math.max(2, ...nodes.map(n=>n.x));
  const sp = Math.min(88, (W-140)/maxX);
  const px = n => 56 + n.x*sp;
  const py = n => LANE_Y[n.lane];

  let st = container._g;
  if(!st){
    container.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px; display:block; margin:0 auto;"></svg>`;
    const svg = container.querySelector('svg');
    const mk = ()=>{ const g=document.createElementNS(SVGNS,'g'); svg.appendChild(g); return g; };
    st = container._g = { svg, staticG:mk(), edgesG:mk(), fxG:mk(), nodesG:mk(), refsG:mk(), nodeEls:new Map(), refEls:new Map(), edgeEls:new Map(), refPos:new Map() };
  }
  if(!st.fxG){ st.fxG = document.createElementNS(SVGNS,'g'); st.svg.insertBefore(st.fxG, st.nodesG); }
  if(!st.edgeEls) st.edgeEls = new Map();
  if(!st.refPos) st.refPos = new Map();

  /* static layer: lane guides + remote box */
  let stat = '';
  [...new Set(nodes.map(n=>n.lane))].forEach(l=>{
    stat += `<line x1="26" y1="${LANE_Y[l]}" x2="${W-26}" y2="${LANE_Y[l]}" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>`;
  });
  if(step.remoteBox){
    stat += `<rect x="18" y="${LANE_Y[0]-30}" width="${W-36}" height="58" rx="10" fill="none" stroke="rgba(255,255,255,0.14)" stroke-dasharray="6 5"/>
             <text x="30" y="${LANE_Y[0]-14}" font-size="10" fill="${GC.ink}" letter-spacing="1">origin (remote)</text>`;
  }
  st.staticG.innerHTML = stat;

  /* edges layer: keyed paths — new edges DRAW themselves in + send a pulse dot along the path */
  const edgeD = (A,B)=>{
    const x1=px(A), y1=py(A), x2=px(B), y2=py(B);
    if(y1===y2) return `M${x1+16} ${y1} L${x2-16} ${y2}`;
    return `M${x1+12} ${y1+(y2>y1?12:-12)} Q ${x1+12} ${(y1+y2)/2} ${(x1+x2)/2} ${(y1+y2)/2} T ${x2-12} ${y2+(y1>y2?12:-12)}`;
  };
  const seenEdges = new Set();
  edges.forEach(([a,b,style])=>{
    const A=nodeById[a], B=nodeById[b]; if(!A||!B) return;
    const key = a+'->'+b;
    seenEdges.add(key);
    const d = edgeD(A,B);
    const col = style==='new' ? GC.feat : style==='danger' ? GC.danger : 'rgba(255,255,255,0.3)';
    let el = st.edgeEls.get(key);
    if(!el){
      el = document.createElementNS(SVGNS,'path');
      el.setAttribute('fill','none');
      el.setAttribute('stroke-width','2.5');
      el.setAttribute('d', d);
      st.edgesG.appendChild(el);
      st.edgeEls.set(key, el);
      /* draw-in: dash the full length, then release */
      const L = el.getTotalLength();
      el.setAttribute('stroke-dasharray', L);
      el.setAttribute('stroke-dashoffset', L);
      el.style.transition = 'stroke-dashoffset .55s cubic-bezier(.3,.7,.3,1)';
      requestAnimationFrame(()=>requestAnimationFrame(()=>{ el.setAttribute('stroke-dashoffset', 0); }));
      setTimeout(()=>{
        el.style.transition = '';
        if(style==='new'){ el.setAttribute('stroke-dasharray','6 4'); el.style.animation='dashFlow .8s linear infinite'; }
        else if(style==='danger'){ el.setAttribute('stroke-dasharray','4 4'); el.removeAttribute('stroke-dashoffset'); }
        else { el.removeAttribute('stroke-dasharray'); el.removeAttribute('stroke-dashoffset'); }
      }, 620);
      /* pulse dot travels the new edge */
      const dot = document.createElementNS(SVGNS,'circle');
      dot.setAttribute('r','4.5');
      dot.setAttribute('fill', col);
      dot.style.filter = `drop-shadow(0 0 6px ${col})`;
      const mo = document.createElementNS(SVGNS,'animateMotion');
      mo.setAttribute('dur','0.65s');
      mo.setAttribute('path', d.replace(/^M/,'M '));
      mo.setAttribute('fill','freeze');
      dot.appendChild(mo);
      st.fxG.appendChild(dot);
      setTimeout(()=>dot.remove(), 750);
    } else {
      el.setAttribute('d', d);
      if(style==='new'){ el.setAttribute('stroke-dasharray','6 4'); el.style.animation='dashFlow .8s linear infinite'; }
      else if(style==='danger'){ el.setAttribute('stroke-dasharray','4 4'); el.style.animation=''; }
      else { el.removeAttribute('stroke-dasharray'); el.style.animation=''; }
    }
    el.setAttribute('stroke', col);
  });
  st.edgeEls.forEach((el, key)=>{
    if(!seenEdges.has(key)){
      el.style.transition = 'opacity .3s ease';
      el.style.opacity = '0';
      setTimeout(()=>el.remove(), 320);
      st.edgeEls.delete(key);
    }
  });

  /* nodes layer: keyed groups, position tweened via CSS transform transition */
  const seen = new Set();
  nodes.forEach(n=>{
    seen.add(n.id);
    let el = st.nodeEls.get(n.id);
    const isNew = !el;
    if(isNew){
      el = document.createElementNS(SVGNS,'g');
      el.style.transition = 'transform .55s cubic-bezier(.25,.8,.3,1.1), opacity .35s ease';
      el.innerHTML = `<circle r="16"/><text y="4" text-anchor="middle" font-size="10" font-weight="600"></text><g class="xmark"></g>`;
      el.style.opacity = '0';
      el.style.transform = `translate(${px(n)}px, ${py(n)}px) scale(0.4)`;
      st.nodesG.appendChild(el);
      st.nodeEls.set(n.id, el);
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        el.style.opacity = '1';
        el.style.transform = `translate(${px(n)}px, ${py(n)}px) scale(1)`;
      }));
      /* double burst ring on arrival */
      if(!n.ghost){
        for(let k=0;k<2;k++){
          const ring = document.createElementNS(SVGNS,'circle');
          ring.setAttribute('cx', px(n)); ring.setAttribute('cy', py(n));
          ring.setAttribute('fill','none'); ring.setAttribute('stroke', n.color);
          ring.style.animation = `ringBurst .75s cubic-bezier(.2,.9,.3,1) forwards`;
          ring.style.animationDelay = (k*0.13)+'s';
          st.fxG.appendChild(ring);
          setTimeout(()=>ring.remove(), 1000);
        }
      }
    } else {
      el.style.opacity = '1';
      el.style.transform = `translate(${px(n)}px, ${py(n)}px) scale(1)`;
    }
    const circ = el.querySelector('circle');
    const stroke = n.ghost ? GC.ghost : n.color;
    circ.setAttribute('fill', n.color);
    circ.setAttribute('fill-opacity', n.ghost ? 0 : 0.14);
    circ.setAttribute('stroke', stroke);
    circ.setAttribute('stroke-width', n.glow ? 3 : 2.5);
    if(n.ghost) circ.setAttribute('stroke-dasharray','3 3'); else circ.removeAttribute('stroke-dasharray');
    circ.style.color = n.color;
    circ.style.animation = n.glow ? 'pulseGlow 1.2s ease infinite' : '';
    const txt = el.querySelector('text');
    txt.textContent = n.hash;
    txt.setAttribute('fill', n.ghost ? GC.ghost : n.color);
    el.querySelector('.xmark').innerHTML = n.cross
      ? `<line x1="-20" y1="-20" x2="20" y2="20" stroke="${GC.danger}" stroke-width="3"/><line x1="-20" y1="20" x2="20" y2="-20" stroke="${GC.danger}" stroke-width="3"/>`
      : '';
  });
  st.nodeEls.forEach((el, id)=>{
    if(!seen.has(id)){
      el.style.opacity = '0';
      setTimeout(()=>{ el.remove(); }, 380);
      st.nodeEls.delete(id);
    }
  });

  /* refs layer: keyed pills, tweened */
  const seenRefs = new Set();
  refs.forEach(r=>{
    const n = nodeById[r.node]; if(!n) return;
    seenRefs.add(r.name);
    const x = px(n), y = py(n) + (r.below ? 34 : -34);
    const w = r.name.length*6.4 + 18;
    let el = st.refEls.get(r.name);
    if(!el){
      el = document.createElementNS(SVGNS,'g');
      el.style.transition = 'transform .55s cubic-bezier(.25,.8,.3,1.1), opacity .35s ease';
      el.innerHTML = `<g class="pillbody"><rect y="-11" height="20" rx="10" fill-opacity="0.16" stroke-width="1.4"/><text y="4" text-anchor="middle" font-size="10" font-weight="700"></text></g>`;
      el.style.opacity = '0';
      el.style.transform = `translate(${x}px, ${y}px)`;
      st.refsG.appendChild(el);
      st.refEls.set(r.name, el);
      requestAnimationFrame(()=>requestAnimationFrame(()=>{ el.style.opacity='1'; }));
    } else {
      const prev = st.refPos.get(r.name);
      el.style.transform = `translate(${x}px, ${y}px)`;
      el.style.opacity = '1';
      /* springy hop when the label jumps to a new commit */
      if(prev && (prev.x !== x || prev.y !== y)){
        const body = el.querySelector('.pillbody');
        body.style.animation = 'none';
        void body.getBBox();
        body.style.animation = 'pillHop .5s cubic-bezier(.3,1.6,.4,1)';
      }
    }
    st.refPos.set(r.name, {x, y});
    const rect = el.querySelector('rect');
    rect.setAttribute('x', -w/2); rect.setAttribute('width', w);
    rect.setAttribute('fill', r.color); rect.setAttribute('stroke', r.color);
    const t = el.querySelector('text');
    t.textContent = r.name; t.setAttribute('fill', r.color);
  });
  st.refEls.forEach((el, name)=>{
    if(!seenRefs.has(name)){
      el.style.opacity = '0';
      setTimeout(()=>{ el.remove(); }, 380);
      st.refEls.delete(name);
    }
  });
}

/* ---- scene library: each returns [step1, step2, step3] ---- */
function getScene(cmd){
  const c = cmd.toLowerCase();
  const base3 = [N('c1',1,2,GC.main), N('c2',2,2,GC.main), N('c3',3,2,GC.main)];
  const baseEdges = [['c1','c2'],['c2','c3']];
  const mainRef = (node,extra=[]) => [{name:'main',node,color:GC.main},{name:'HEAD',node,color:GC.warn,below:true},...extra];

  const S = {
    commit: [
      { nodes:base3, edges:baseEdges, refs:mainRef('c3'), note:'history so far — HEAD sits on the newest commit' },
      { nodes:[...base3, N('c4',4,2,GC.feat,{ghost:true})], edges:[...baseEdges,['c3','c4','new']], refs:mainRef('c3'), note:'staged changes become a new snapshot…' },
      { nodes:[...base3, N('c4',4,2,GC.feat,{pop:true,glow:true})], edges:[...baseEdges,['c3','c4']], refs:mainRef('c4'), note:'commit created — main and HEAD move forward together' },
    ],
    amend: [

function renderIcon(container, catIndex, seed, upToStep, cmd){
  const scene = getScene(cmd || '');
  drawGraph(container, scene[Math.min(upToStep, scene.length-1)]);
  return scene;
}

/* ============================================================
   LIVE PLAYGROUND — type git commands, graph updates live
   ============================================================ */
const PG = {
  reset(){
    this.seq = 0;
    this.commits = { c0: { parents: [], lane: 2 } };
    this.branches = { main: 'c0' };
    this.laneOf = { main: 2 };
    this.laneCycle = [1, 3, 0];
    this.nextLane = 0;
    this.head = 'main';
    this.tags = {};
    this.msg = 'Fresh repo with one root commit. Try: git commit';
    this.ok = true;
  },
  newId(){ return 'c' + (++this.seq); },
  tip(){ return this.branches[this.head]; },
  isAncestor(a, b){ /* is a an ancestor of (or equal to) b */
    const stack = [b], seen = new Set();
    while(stack.length){
      const id = stack.pop();
      if(id === a) return true;
      if(seen.has(id)) continue; seen.add(id);
      (this.commits[id]?.parents || []).forEach(p => stack.push(p));
    }
    return false;
  },
  uniqueChain(branch, ontoTip){ /* commits on branch not reachable from ontoTip, oldest first */
    const out = [];
    let id = this.branches[branch];
    while(id && !this.isAncestor(id, ontoTip)){
      out.unshift(id);
      id = (this.commits[id].parents || [])[0];
    }
    return out;
  },
  exec(raw){
    const line = raw.trim().replace(/^git\s+/, '');
    const [verb, ...args] = line.split(/\s+/);
    const a0 = args[0];
    this.ok = true;
    switch(verb){
      case 'commit': {
        const id = this.newId();
        this.commits[id] = { parents: [this.tip()], lane: this.laneOf[this.head] };
        this.branches[this.head] = id;
        this.msg = `Committed ${id} on ${this.head}.`;
        break;
      }
      case 'branch': {
        if(!a0){ this.ok=false; this.msg='Usage: git branch <name>'; break; }
        if(this.branches[a0]){ this.ok=false; this.msg=`Branch '${a0}' already exists.`; break; }
        this.branches[a0] = this.tip();
        this.laneOf[a0] = this.laneCycle[this.nextLane++ % this.laneCycle.length];
        this.msg = `Branch '${a0}' created at ${this.tip()}. Switch with: git switch ${a0}`;
        break;
      }
      case 'switch': case 'checkout': {
        let name = a0;
        if(a0 === '-c' || a0 === '-b'){
          name = args[1];
          if(!name){ this.ok=false; this.msg=`Usage: git ${verb} ${a0} <name>`; break; }
          if(!this.branches[name]){
            this.branches[name] = this.tip();
            this.laneOf[name] = this.laneCycle[this.nextLane++ % this.laneCycle.length];
          }
        }
        if(!this.branches[name]){ this.ok=false; this.msg=`No branch named '${name}'.`; break; }
        this.head = name;
        this.msg = `Switched to '${name}' (tip: ${this.branches[name]}).`;
        break;
      }
      case 'merge': {
        if(!a0 || !this.branches[a0]){ this.ok=false; this.msg=`Usage: git merge <existing-branch>`; break; }
        const target = this.branches[a0];
        if(this.isAncestor(target, this.tip())){ this.msg = `Already up to date — ${a0} is behind ${this.head}.`; break; }
        if(this.isAncestor(this.tip(), target)){
          this.branches[this.head] = target;
          this.msg = `Fast-forward: ${this.head} slid up to ${target} (no merge commit needed).`;
          break;
        }
        const id = this.newId();
        this.commits[id] = { parents: [this.tip(), target], lane: this.laneOf[this.head], merge:true };
        this.branches[this.head] = id;
        this.msg = `Merge commit ${id} created with two parents.`;
        break;
      }
      case 'rebase': {
        if(!a0 || !this.branches[a0]){ this.ok=false; this.msg=`Usage: git rebase <existing-branch>`; break; }
        const ontoTip = this.branches[a0];
        const chain = this.uniqueChain(this.head, ontoTip);
        if(!chain.length){ this.msg = `Nothing to rebase — ${this.head} is already based on ${a0}.`; break; }
        let base = ontoTip;
        chain.forEach(old=>{
          const id = old + "'";
          this.commits[id] = { parents: [base], lane: this.laneOf[a0] };
          base = id;
        });
        this.branches[this.head] = base;
        this.msg = `Rebased: ${chain.length} commit(s) replayed onto ${a0} as ${chain.map(c=>c+"'").join(', ')}.`;
        break;
      }
      case 'reset': {
        const m = line.match(/HEAD~(\d+)/);
        const n = m ? parseInt(m[1],10) : 1;
        let id = this.tip();
        for(let i=0;i<n;i++){ const p=(this.commits[id].parents||[])[0]; if(!p){ break; } id=p; }
        this.branches[this.head] = id;
        this.msg = `${this.head} moved back to ${id}. Orphaned commits fade away (reflog would remember).`;
        break;
      }
      case 'revert': {
        const id = this.newId();
        const reverted = this.tip();
        this.commits[id] = { parents: [reverted], lane: this.laneOf[this.head], hashLabel: '!' + reverted };
        this.branches[this.head] = id;
        this.msg = `Revert commit added — undoes ${reverted} without rewriting history.`;
        break;
      }
      case 'cherry-pick': {
        if(!a0 || !this.commits[a0]){ this.ok=false; this.msg=`Usage: git cherry-pick <commit-id> (e.g. one shown in the graph)`; break; }
        const id = a0 + "'";
        if(this.commits[id]){ this.ok=false; this.msg=`${a0} was already picked.`; break; }
        this.commits[id] = { parents: [this.tip()], lane: this.laneOf[this.head] };
        this.branches[this.head] = id;
        this.msg = `Copied ${a0} onto ${this.head} as ${id}.`;
        break;
      }
      case 'tag': {
        if(!a0){ this.ok=false; this.msg='Usage: git tag <name>'; break; }
        this.tags[a0] = this.tip();
        this.msg = `Tag '${a0}' pinned to ${this.tip()} forever.`;
        break;
      }
      case 'reset-playground': case 'clear': this.reset(); break;
      default:
        this.ok = false;
        this.msg = `Unknown or unsupported: '${verb}'. Supported: commit, branch, switch/checkout [-c], merge, rebase, reset --hard HEAD~n, revert, cherry-pick <id>, tag, clear.`;
    }
  },
  toStep(){
    /* reachable commits only */
    const reach = new Set();
    const roots = [...Object.values(this.branches), ...Object.values(this.tags)];
    const stack = [...roots];
    while(stack.length){
      const id = stack.pop();
      if(!id || reach.has(id)) continue; reach.add(id);
      (this.commits[id]?.parents || []).forEach(p=>stack.push(p));
    }
    /* depth = longest path from root */
    const depth = {};
    const d = (id)=>{
      if(depth[id] !== undefined) return depth[id];
      const ps = this.commits[id].parents || [];
      depth[id] = ps.length ? 1 + Math.max(...ps.map(d)) : 0;
      return depth[id];
    };
    const nodes = [], edges = [];
    reach.forEach(id=>{
      const c = this.commits[id];
      const isTip = this.branches[this.head] === id;
      nodes.push({ id, x: d(id), lane: c.lane, color: c.merge ? GC.warn : (c.lane===2 ? GC.main : GC.feat), hash: c.hashLabel || id, glow: isTip, pop: false });
      (c.parents||[]).forEach(p=>{ if(reach.has(p)) edges.push([p, id]); });
    });
    const refs = [];
    Object.entries(this.branches).forEach(([name, id], i)=>{
      refs.push({ name, node: id, color: name==='main' ? GC.main : GC.feat, below: false });
    });
    refs.push({ name: 'HEAD', node: this.branches[this.head], color: GC.warn, below: true });
    Object.entries(this.tags).forEach(([name, id])=>{
      refs.push({ name: '🏷 '+name, node: id, color: GC.warn, below: true });
    });
    return { nodes, edges, refs };
  },
};

/* isolated repo instances for exercises (share PG's methods) */
function newRepo(setupCmds=[]){
  const r = Object.create(PG);
  r.reset();
  setupCmds.forEach(c=>r.exec(c));
  r.msg = ''; r.ok = true;
  return r;
}
